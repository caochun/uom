schema: uom.domain.v1
name: FoxOMS
version: 0.2.0
description: 面向多个受管企业日常运营的对象关系模型，追踪业务主体、商机、招投标、 商务约定、履约资源、知识资产、开票和回款，并用模型驱动 Action 形成完整业务事实。
repositories:
  graph:
    type: sqlite_graph
    mode: writable
    config:
      database: data/graph.db
default_repository: graph
properties:
  is_managed:
    name: 是否受管
    type: boolean
    description: 是否属于 FoxOMS 直接管理其运营过程的业务主体。
  bid_result:
    name: 投标结果
    type: string
    description: 投标记录的当前结果，用于表达是否中标。
  amount:
    name: 金额
    type: money
    description: 发票或回款记录的总金额。
  issued_date:
    name: 开票日期
    type: date
    description: 发票开具的日期。
  received_date:
    name: 回款日期
    type: date
    description: 企业收到客户回款的日期。
  participation_role:
    name: 参与角色
    type: string
    description: 业务主体在具体业务中承担的角色。
  quantity:
    name: 投入数量
    type: number
    description: 一次资源投入的数量。
  unit:
    name: 投入单位
    type: string
    description: 资源投入数量使用的计量单位。
  start_date:
    name: 开始日期
    type: date
    description: 资源投入开始的日期。
  end_date:
    name: 结束日期
    type: date
    description: 资源投入结束的日期。
  ip_role:
    name: 知识资产角色
    type: string
    description: 知识资产在订单、项目或任务中是所需条件还是产生成果。
  settled_amount:
    name: 核销金额
    type: money
    description: 一笔回款分配到某张发票的金额。
objects:
  party:
    name: 业务主体
    description: 参与企业运营活动的个人或组织。
    properties:
      is_managed: required
  opportunity:
    name: 商机
    description: 由某个受管业务主体跟进、可能形成后续交易的潜在商业机会。
    properties: {}
  tender:
    name: 招标事项
    description: 与商机关联、由招标方组织的招标活动。
    properties: {}
  bid:
    name: 投标记录
    description: 一个或多个业务主体针对招标事项形成的一次投标。
    properties:
      bid_result: optional
  framework_agreement:
    name: 框架协议
    description: 中标后签订、用于约定后续订单合作规则的框架性协议。
    properties: {}
  contract:
    name: 项目合同
    description: 中标后围绕具体项目或任务签订的服务采购合同。
    properties: {}
  order:
    name: 订单
    description: 客户依据框架协议向服务提供方发出的具体服务采购。
    properties: {}
  work_item:
    name: 项目/任务
    description: 由项目合同定义并由企业组织履行的具体工作事项。
    properties: {}
  personnel:
    name: 人员
    description: 可被安排参与订单、项目或任务的人员资源。
    properties: {}
  software_resource:
    name: 软件资源
    description: 可被配置到订单、项目或任务的软件、许可或使用权。
    properties: {}
  hardware_resource:
    name: 硬件资源
    description: 可被配置到订单、项目或任务的设备或硬件资产。
    properties: {}
  intellectual_asset:
    name: 知识资产
    description: 与某个订单、项目或任务关联的专利、论文、软著或技术报告。
    properties: {}
  invoice:
    name: 发票
    description: 受管主体依据合同或订单向客户开具的发票。
    properties:
      amount: required
      issued_date: required
  receipt:
    name: 回款
    description: 客户针对发票向受管主体支付并已到账的款项。
    properties:
      amount: required
      received_date: required
relations:
  participates_in:
    name: 参与业务
    description: 业务主体以特定角色参与某个业务对象。
    from:
    - party
    to:
    - opportunity
    - tender
    - bid
    - framework_agreement
    - contract
    - order
    - work_item
    properties:
      participation_role: required
  contains:
    name: 包含
    description: 表达商机包含招标事项、招标事项包含投标记录、框架协议包含订单， 或项目合同定义项目/任务的结构关系。
    from:
    - opportunity
    - tender
    - framework_agreement
    - contract
    - order
    to:
    - tender
    - bid
    - order
    - work_item
    - invoice
    properties: {}
  derives:
    name: 形成
    description: 中标的投标记录形成后续框架协议或项目合同。
    from:
    - bid
    to:
    - framework_agreement
    - contract
    properties: {}
  allocated_to:
    name: 投入到
    description: 人员、软件或硬件在一定期间内投入某个订单、项目或任务。
    from:
    - personnel
    - software_resource
    - hardware_resource
    to:
    - order
    - work_item
    properties:
      quantity: required
      unit: required
      start_date: optional
      end_date: optional
  involves_ip:
    name: 涉及知识资产
    description: 订单、项目或任务所需或产生的知识资产；每项知识资产只关联一个履约对象。
    from:
    - order
    - work_item
    to:
    - intellectual_asset
    properties:
      ip_role: required
  settles:
    name: 核销
    description: 一笔回款以指定金额核销一张发票。
    from:
    - receipt
    to:
    - invoice
    properties:
      settled_amount: required
functions: {}
actions:
  register_party:
    name: 登记业务主体
    description: 登记参与企业运营的个人或组织，并标识其是否属于 FoxOMS 受管范围。
    icon: building_2
    'on': []
    context: ''
    inputs:
      name:
        name: 主体名称
        description: ''
        required: true
        type: string
      is_managed:
        name: 是否受管
        description: ''
        required: true
        property: is_managed
        default: false
    requires: []
    changes:
      create:
        objects:
        - party
        relations: []
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 登记新的业务主体。
    idempotency: required
  register_personnel:
    name: 登记人员
    description: 登记可投入订单、项目或任务的人员资源。
    icon: user_round_plus
    'on': []
    context: ''
    inputs:
      name:
        name: 人员名称
        description: ''
        required: true
        type: string
    requires: []
    changes:
      create:
        objects:
        - personnel
        relations: []
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 登记新的人员资源。
    idempotency: required
  register_software_resource:
    name: 登记软件资源
    description: 登记可配置到订单、项目或任务的软件、许可或使用权。
    icon: app_window
    'on': []
    context: ''
    inputs:
      name:
        name: 软件资源名称
        description: ''
        required: true
        type: string
    requires: []
    changes:
      create:
        objects:
        - software_resource
        relations: []
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 登记新的软件资源。
    idempotency: required
  register_hardware_resource:
    name: 登记硬件资源
    description: 登记可配置到订单、项目或任务的设备或硬件资产。
    icon: server
    'on': []
    context: ''
    inputs:
      name:
        name: 硬件资源名称
        description: ''
        required: true
        type: string
    requires: []
    changes:
      create:
        objects:
        - hardware_resource
        relations: []
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 登记新的硬件资源。
    idempotency: required
  create_opportunity:
    name: 建立商机
    description: 为受管业务主体建立商机，并记录经营方和潜在客户。
    icon: lightbulb
    'on': []
    context: ''
    inputs:
      name:
        name: 商机名称
        description: ''
        required: true
        type: string
      operating_party_id:
        name: 经营方
        description: ''
        required: true
        objects:
        - party
      potential_customer_id:
        name: 潜在客户
        description: ''
        required: true
        objects:
        - party
    requires: []
    changes:
      create:
        objects:
        - opportunity
        relations:
        - participates_in
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 建立商机及其主要参与主体。
    idempotency: required
  register_tender:
    name: 登记招标事项
    description: 在商机下登记招标事项，并记录招标方和可选的招标代理。
    icon: landmark
    'on':
    - opportunity
    context: opportunity_id
    inputs:
      opportunity_id:
        name: 所属商机
        description: ''
        required: true
        objects:
        - opportunity
      name:
        name: 招标事项名称
        description: ''
        required: true
        type: string
      tenderer_id:
        name: 招标方
        description: ''
        required: true
        objects:
        - party
      tender_agent_id:
        name: 招标代理
        description: ''
        required: false
        objects:
        - party
    requires: []
    changes:
      create:
        objects:
        - tender
        relations:
        - contains
        - participates_in
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 在商机下登记招标事项。
    idempotency: required
  register_bid:
    name: 登记投标
    description: 在招标事项下登记一份投标，并记录牵头投标方。
    icon: file_check_2
    'on':
    - tender
    context: tender_id
    inputs:
      tender_id:
        name: 所属招标事项
        description: ''
        required: true
        objects:
        - tender
      name:
        name: 投标名称
        description: ''
        required: true
        type: string
      lead_bidder_id:
        name: 牵头投标方
        description: ''
        required: true
        objects:
        - party
    requires: []
    changes:
      create:
        objects:
        - bid
        relations:
        - contains
        - participates_in
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 在招标事项下登记投标。
    idempotency: required
  add_business_participant:
    name: 补充业务参与方
    description: 为业务对象补充推荐方、代理方、联合体成员或其他可核实的参与主体。
    icon: user_round_plus
    'on':
    - opportunity
    - tender
    - bid
    - framework_agreement
    - contract
    - order
    - work_item
    context: business_object_id
    inputs:
      business_object_id:
        name: 业务对象
        description: ''
        required: true
        objects:
        - opportunity
        - tender
        - bid
        - framework_agreement
        - contract
        - order
        - work_item
      party_id:
        name: 业务主体
        description: ''
        required: true
        objects:
        - party
      participation_role:
        name: 参与角色
        description: ''
        required: true
        property: participation_role
    requires: []
    changes:
      create:
        objects: []
        relations:
        - participates_in
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 补充业务参与主体及其角色。
    idempotency: required
  record_bid_result:
    name: 记录投标结果
    description: 为尚未形成结果的投标记录中标或未中标结论。
    icon: badge_check
    'on':
    - bid
    context: bid_id
    inputs:
      bid_id:
        name: 投标记录
        description: ''
        required: true
        objects:
        - bid
      bid_result:
        name: 投标结果
        description: ''
        required: true
        property: bid_result
    requires: []
    changes:
      create:
        objects: []
        relations: []
      update:
        objects:
        - bid
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 记录投标结果。
    idempotency: required
  sign_framework_agreement:
    name: 签订框架协议
    description: 基于中标投标签订框架协议，并记录实际服务提供方和客户。
    icon: file_signature
    'on':
    - bid
    context: bid_id
    inputs:
      bid_id:
        name: 中标投标
        description: ''
        required: true
        objects:
        - bid
      name:
        name: 框架协议名称
        description: ''
        required: true
        type: string
      service_provider_id:
        name: 服务提供方
        description: ''
        required: true
        objects:
        - party
      customer_id:
        name: 客户
        description: ''
        required: true
        objects:
        - party
    requires: []
    changes:
      create:
        objects:
        - framework_agreement
        relations:
        - derives
        - participates_in
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 基于中标投标签订框架协议。
    idempotency: required
  issue_order:
    name: 下达订单
    description: 在框架协议下登记一项具体服务采购订单，交易主体从框架协议推导。
    icon: clipboard_list
    'on':
    - framework_agreement
    context: framework_agreement_id
    inputs:
      framework_agreement_id:
        name: 所属框架协议
        description: ''
        required: true
        objects:
        - framework_agreement
      name:
        name: 订单名称
        description: ''
        required: true
        type: string
    requires: []
    changes:
      create:
        objects:
        - order
        relations:
        - contains
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 在框架协议下登记订单。
    idempotency: required
  sign_project_contract:
    name: 签订项目合同
    description: 基于中标投标签订项目合同，并记录实际服务提供方和客户。
    icon: file_check_2
    'on':
    - bid
    context: bid_id
    inputs:
      bid_id:
        name: 中标投标
        description: ''
        required: true
        objects:
        - bid
      name:
        name: 项目合同名称
        description: ''
        required: true
        type: string
      service_provider_id:
        name: 服务提供方
        description: ''
        required: true
        objects:
        - party
      customer_id:
        name: 客户
        description: ''
        required: true
        objects:
        - party
    requires: []
    changes:
      create:
        objects:
        - contract
        relations:
        - derives
        - participates_in
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 基于中标投标签订项目合同。
    idempotency: required
  define_work_item:
    name: 建立项目/任务
    description: 在项目合同下建立由企业组织履行的项目或任务，交易主体从合同推导。
    icon: briefcase_business
    'on':
    - contract
    context: contract_id
    inputs:
      contract_id:
        name: 所属项目合同
        description: ''
        required: true
        objects:
        - contract
      name:
        name: 项目/任务名称
        description: ''
        required: true
        type: string
    requires: []
    changes:
      create:
        objects:
        - work_item
        relations:
        - contains
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 在项目合同下建立项目或任务。
    idempotency: required
  allocate_personnel:
    name: 安排人员
    description: 将人员按数量、单位和期间投入订单、项目或任务。
    icon: users
    'on':
    - order
    - work_item
    context: target_id
    inputs:
      target_id:
        name: 投入目标
        description: ''
        required: true
        objects:
        - order
        - work_item
      resource_id:
        name: 人员
        description: ''
        required: true
        objects:
        - personnel
      quantity:
        name: 投入数量
        description: ''
        required: true
        property: quantity
      unit:
        name: 投入单位
        description: ''
        required: true
        property: unit
        default: person_day
      start_date:
        name: 开始日期
        description: ''
        required: false
        property: start_date
      end_date:
        name: 结束日期
        description: ''
        required: false
        property: end_date
    requires: []
    changes:
      create:
        objects: []
        relations:
        - allocated_to
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 安排人员投入履约。
    idempotency: required
  allocate_software:
    name: 配置软件
    description: 将软件、许可或使用权按数量、单位和期间投入订单、项目或任务。
    icon: app_window
    'on':
    - order
    - work_item
    context: target_id
    inputs:
      target_id:
        name: 投入目标
        description: ''
        required: true
        objects:
        - order
        - work_item
      resource_id:
        name: 软件资源
        description: ''
        required: true
        objects:
        - software_resource
      quantity:
        name: 投入数量
        description: ''
        required: true
        property: quantity
      unit:
        name: 投入单位
        description: ''
        required: true
        property: unit
        default: license_month
      start_date:
        name: 开始日期
        description: ''
        required: false
        property: start_date
      end_date:
        name: 结束日期
        description: ''
        required: false
        property: end_date
    requires: []
    changes:
      create:
        objects: []
        relations:
        - allocated_to
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 配置软件资源投入履约。
    idempotency: required
  allocate_hardware:
    name: 调配硬件
    description: 将设备或硬件资产按数量、单位和期间投入订单、项目或任务。
    icon: server
    'on':
    - order
    - work_item
    context: target_id
    inputs:
      target_id:
        name: 投入目标
        description: ''
        required: true
        objects:
        - order
        - work_item
      resource_id:
        name: 硬件资源
        description: ''
        required: true
        objects:
        - hardware_resource
      quantity:
        name: 投入数量
        description: ''
        required: true
        property: quantity
      unit:
        name: 投入单位
        description: ''
        required: true
        property: unit
        default: device_month
      start_date:
        name: 开始日期
        description: ''
        required: false
        property: start_date
      end_date:
        name: 结束日期
        description: ''
        required: false
        property: end_date
    requires: []
    changes:
      create:
        objects: []
        relations:
        - allocated_to
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 调配硬件资源投入履约。
    idempotency: required
  register_intellectual_asset:
    name: 登记知识资产
    description: 登记某个订单、项目或任务所需或产生的知识资产，并一次完成唯一归属关联。
    icon: badge_check
    'on':
    - order
    - work_item
    context: target_id
    inputs:
      target_id:
        name: 关联业务
        description: ''
        required: true
        objects:
        - order
        - work_item
      name:
        name: 知识资产名称
        description: ''
        required: true
        type: string
      ip_role:
        name: 知识资产角色
        description: ''
        required: true
        property: ip_role
    requires: []
    changes:
      create:
        objects:
        - intellectual_asset
        relations:
        - involves_ip
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 登记知识资产及其履约角色。
    idempotency: required
  issue_invoice:
    name: 开具发票
    description: 基于项目合同或订单登记一张发票；开票方和受票方从上游业务推导。
    icon: receipt_text
    'on':
    - contract
    - order
    context: parent_id
    inputs:
      parent_id:
        name: 所属合同/订单
        description: ''
        required: true
        objects:
        - contract
        - order
      name:
        name: 发票名称
        description: ''
        required: true
        type: string
