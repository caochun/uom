  personnel:
    display_name: 人员
    summary: 可被安排参与订单、项目或任务的人员资源。
    description: 可被安排参与订单、项目或任务的人员资源。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: personnel
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
  software_resource:
    display_name: 软件资源
    summary: 可被配置到订单、项目或任务的软件、许可或使用权。
    description: 可被配置到订单、项目或任务的软件、许可或使用权。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
