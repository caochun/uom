        type: str
        required: true
        description: 对象名称
  invoice:
    display_name: 发票
    summary: 受管主体依据合同或订单向客户开具的发票。
    description: 受管主体依据合同或订单向客户开具的发票。
    type_policy: closed
    mutability: mutable
