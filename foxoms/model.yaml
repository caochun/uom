relations:
  participates_in:
    display_name: 参与业务
    summary: 业务主体以特定角色参与某个业务对象。
    description: 业务主体以特定角色参与某个业务对象。
    from_types:
    - party
    to_types:
    - opportunity
    - tender
    - bid
    - framework_agreement
    - contract
    - order
    - work_item
    directed: true
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: relation
        type: participates_in
    properties:
      id:
        type: str
        required: true
        description: 稳定关系 ID
      from:
        type: str
        required: true
        description: 起点对象 ID
      to:
        type: str
        required: true
        description: 终点对象 ID
      participation_role:
        type: string
        required: true
        display_name: 参与角色
        description: 业务主体在具体业务中承担的角色。
  contains:
    display_name: 包含
    summary: 表达商机包含招标事项、招标事项包含投标记录、框架协议包含订单， 或项目合同定义项目/任务的结构关系。
    description: 表达商机包含招标事项、招标事项包含投标记录、框架协议包含订单， 或项目合同定义项目/任务的结构关系。
    from_types:
    - opportunity
    - tender
    - framework_agreement
    - contract
    - order
    to_types:
    - tender
    - bid
    - order
    - work_item
    - invoice
    directed: true
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: relation
        type: contains
    properties:
      id:
        type: str
        required: true
        description: 稳定关系 ID
      from:
        type: str
        required: true
        description: 起点对象 ID
      to:
        type: str
        required: true
        description: 终点对象 ID
  derives:
    display_name: 形成
    summary: 中标的投标记录形成后续框架协议或项目合同。
    description: 中标的投标记录形成后续框架协议或项目合同。
    from_types:
    - bid
    to_types:
    - framework_agreement
    - contract
    directed: true
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: relation
        type: derives
    properties:
      id:
        type: str
        required: true
        description: 稳定关系 ID
      from:
        type: str
        required: true
        description: 起点对象 ID
      to:
        type: str
        required: true
        description: 终点对象 ID
  allocated_to:
    display_name: 投入到
    summary: 人员、软件或硬件在一定期间内投入某个订单、项目或任务。
    description: 人员、软件或硬件在一定期间内投入某个订单、项目或任务。
    from_types:
    - personnel
    - software_resource
    - hardware_resource
    to_types:
    - order
    - work_item
    directed: true
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: relation
        type: allocated_to
    properties:
      id:
        type: str
        required: true
        description: 稳定关系 ID
      from:
        type: str
        required: true
        description: 起点对象 ID
      to:
        type: str
        required: true
        description: 终点对象 ID
      quantity:
        type: number
        required: true
        display_name: 投入数量
        description: 一次资源投入的数量。
      unit:
        type: string
        required: true
        display_name: 投入单位
        description: 资源投入数量使用的计量单位。
      start_date:
        type: date
        required: false
        display_name: 开始日期
        description: 资源投入开始的日期。
      end_date:
        type: date
        required: false
        display_name: 结束日期
        description: 资源投入结束的日期。
  involves_ip:
    display_name: 涉及知识资产
    summary: 订单、项目或任务所需或产生的知识资产；每项知识资产只关联一个履约对象。
    description: 订单、项目或任务所需或产生的知识资产；每项知识资产只关联一个履约对象。
    from_types:
    - order
    - work_item
    to_types:
    - intellectual_asset
    directed: true
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: relation
        type: involves_ip
    properties:
      id:
        type: str
        required: true
        description: 稳定关系 ID
      from:
        type: str
        required: true
        description: 起点对象 ID
      to:
        type: str
        required: true
        description: 终点对象 ID
      ip_role:
        type: string
        required: true
        display_name: 知识资产角色
        description: 知识资产在订单、项目或任务中是所需条件还是产生成果。
  settles:
    display_name: 核销
    summary: 一笔回款以指定金额核销一张发票。
    description: 一笔回款以指定金额核销一张发票。
    from_types:
    - receipt
    to_types:
    - invoice
    directed: true
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: relation
        type: settles
    properties:
      id:
        type: str
        required: true
        description: 稳定关系 ID
      from:
        type: str
        required: true
        description: 起点对象 ID
      to:
        type: str
        required: true
        description: 终点对象 ID
      settled_amount:
        type: money
        required: true
        display_name: 核销金额
        description: 一笔回款分配到某张发票的金额。
functions: {}
actions:
