    available_on: []
    context_input: ''
    inputs:
      name:
        display_name: 主体名称
        description: ''
        type: string
        required: true
        object_types: []
      is_managed:
        display_name: 是否受管
        description: ''
        type: boolean
        required: true
        object_types: []
