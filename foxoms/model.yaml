  hardware_resource:
    display_name: 硬件资源
    summary: 可被配置到订单、项目或任务的设备或硬件资产。
    description: 可被配置到订单、项目或任务的设备或硬件资产。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: hardware_resource
    properties:
      id:
