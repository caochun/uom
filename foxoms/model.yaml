schema: oag.ontology.v1
name: FoxOMS
version: 0.2.0
description: 面向多个受管企业日常运营的对象关系模型，追踪业务主体、商机、招投标、 商务约定、履约资源、知识资产、开票和回款，并用模型驱动 Action 形成完整业务事实。
tool_preferences:
  generic_search: fallback_only
excluded_tools:
- describe
- mutate
- summarize_progress
- dispatch_workers
data_sources:
  uom_graph:
    type: uom_sqlite_graph
    mode: writable
    capabilities:
    - object_query
    - relation_query
    - adjacency_query
    - versioned_changeset
    - history
    config:
      database: data/graph.db
objects:
  party:
    display_name: 业务主体
    summary: 参与企业运营活动的个人或组织。
    description: 参与企业运营活动的个人或组织。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: party
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
      is_managed:
        type: boolean
        required: true
        display_name: 是否受管
        description: 是否属于 FoxOMS 直接管理其运营过程的业务主体。
  opportunity:
    display_name: 商机
    summary: 由某个受管业务主体跟进、可能形成后续交易的潜在商业机会。
    description: 由某个受管业务主体跟进、可能形成后续交易的潜在商业机会。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: opportunity
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
  tender:
    display_name: 招标事项
    summary: 与商机关联、由招标方组织的招标活动。
    description: 与商机关联、由招标方组织的招标活动。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: tender
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
  bid:
    display_name: 投标记录
    summary: 一个或多个业务主体针对招标事项形成的一次投标。
    description: 一个或多个业务主体针对招标事项形成的一次投标。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: bid
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
      bid_result:
        type: string
        required: false
        display_name: 投标结果
        description: 投标记录的当前结果，用于表达是否中标。
  framework_agreement:
    display_name: 框架协议
    summary: 中标后签订、用于约定后续订单合作规则的框架性协议。
    description: 中标后签订、用于约定后续订单合作规则的框架性协议。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: framework_agreement
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
  contract:
    display_name: 项目合同
    summary: 中标后围绕具体项目或任务签订的服务采购合同。
    description: 中标后围绕具体项目或任务签订的服务采购合同。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: contract
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
  order:
    display_name: 订单
    summary: 客户依据框架协议向服务提供方发出的具体服务采购。
    description: 客户依据框架协议向服务提供方发出的具体服务采购。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
