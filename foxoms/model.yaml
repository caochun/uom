      selector:
        kind: object
        type: order
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
  work_item:
    display_name: 项目/任务
    summary: 由项目合同定义并由企业组织履行的具体工作事项。
    description: 由项目合同定义并由企业组织履行的具体工作事项。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: work_item
    properties:
      id:
        type: str
        required: true
