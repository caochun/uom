<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fox OMS</title>
    <link rel="stylesheet" href="/static/styles.css?v=resource-view-2">
  </head>
  <body>
    <aside class="resource-nav">
      <div class="brand">
        <strong>Fox OMS</strong>
        <span>企业资源管理</span>
      </div>
      <div id="atlas" class="atlas"></div>
    </aside>

    <main class="resource-main">
      <header class="topbar">
        <div>
          <p id="contextKind" class="eyebrow">资源视图</p>
          <h1 id="contextTitle">正在读取资源</h1>
          <p id="contextSubtitle">请选择左侧资源。</p>
        </div>
        <div id="contextMetrics" class="summary-strip"></div>
      </header>

      <section class="resource-workspace">
        <section class="list-pane">
          <div class="pane-head">
            <div>
              <h2 id="listTitle">资源列表</h2>
              <span id="listMeta">-</span>
            </div>
          </div>
          <div id="resourceTable" class="resource-table"></div>
        </section>

        <section class="detail-pane">
          <div class="pane-head">
            <div>
              <h2 id="detailTitle">资源详情</h2>
              <span id="detailMeta">字段和相关资源</span>
            </div>
          </div>
          <div id="detailView" class="detail-view"></div>
        </section>
      </section>
    </main>

    <aside class="guidance-pane">
      <div class="guidance-head">
        <span>业务引导</span>
        <strong id="railTitle">业务导航</strong>
      </div>
      <p id="railJudgment" class="guidance-judgment">系统会根据当前资源状态给出建议。</p>
      <div class="guidance-section">
        <div class="guidance-label">下一步</div>
        <div id="railActions" class="guidance-list"></div>
      </div>
      <div class="guidance-section">
        <div class="guidance-label">暂不可用</div>
        <div id="railBlocked" class="blocked-list"></div>
      </div>
      <div id="railResultSection" class="guidance-section result-section hidden">
        <div class="guidance-label">预览结果</div>
        <div id="railResult" class="rail-result"></div>
      </div>
    </aside>

    <script src="/static/app.js?v=resource-view-2"></script>
  </body>
</html>
