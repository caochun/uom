<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fox OMS</title>
    <link rel="stylesheet" href="/static/styles.css?v=oms-shell-1">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <strong>Fox OMS</strong>
        <span>企业资源管理</span>
      </div>
      <nav id="moduleNav" class="module-nav"></nav>
    </aside>

    <main class="app-shell">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">总览</h1>
          <p id="pageSubtitle">正在读取企业资源状态...</p>
        </div>
        <div class="global-search">
          <input id="searchInput" placeholder="搜索员工编号、姓名或公司">
          <button id="searchBtn">搜索</button>
        </div>
      </header>

      <section id="content" class="content"></section>
    </main>

    <aside class="agent-panel">
      <div class="panel-head">
        <span>智能层</span>
        <strong id="agentTitle">系统态势</strong>
      </div>
      <p id="agentSummary">智能层会根据当前资源和本体上下文提供摘要、建议和依据。</p>
      <div class="panel-section">
        <div class="panel-label">下一步</div>
        <ul id="agentActions"></ul>
      </div>
      <div class="panel-section">
        <div class="panel-label">依据</div>
        <div id="agentEvidence" class="evidence-list"></div>
      </div>
    </aside>

    <script src="/static/app.js?v=oms-shell-1"></script>
  </body>
</html>
