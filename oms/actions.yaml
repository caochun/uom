schema: oms.actions.v1
description: "OMS 初版 Action Registry。把 ontology 中的资源、函数和流程阶段收敛成用户可见动作。"

actions:
  home.open:
    label: "返回资源总览"
    kind: navigate
    target:
      module: home

  people.open:
    label: "进入人员模块"
    kind: navigate
    target:
      module: people

  people.search:
    label: "搜索员工"
    kind: focus
    target:
      id: search

  employee.open_current:
    label: "进入当前员工详情"
    kind: navigate
    target:
      module: employee
      employee_id: "{context.employee_id}"

  ontology.employee:
    label: "查看员工本体上下文"
    kind: navigate
    target:
      module: ontology
      object_type: Employee

  ontology.payroll_run:
    label: "查看薪资批次本体"
    kind: navigate
    target:
      module: ontology
      object_type: PayrollRun

  ontology.open:
    label: "查看本体上下文"
    kind: navigate
    target:
      module: ontology
      object_type: "{context.object_type}"

  payroll.open:
    label: "进入薪资模块"
    kind: navigate
    target:
      module: payroll

  payroll.review_diffs:
    label: "复核工资行差异"
    kind: navigate
    target:
      module: payroll
      focus: diffs

  payroll.calculate_batch_preview:
    label: "整批试算薪资"
    kind: ontology_function
    target:
      function: calculate_payroll
    params:
      payroll_run_id: "{context.payroll_run_id}"
      include_warnings: true
    side_effect: preview

  payroll.confirm_deductions:
    label: "确认扣款台账和税务提示"
    kind: navigate
    target:
      module: payroll
      focus: deductions

  payroll.calculate_contributions_preview:
    label: "整批试算社保公积金"
    kind: ontology_function
    target:
      function: calculate_contributions
    params:
      payroll_run_id: "{context.payroll_run_id}"
      include_warnings: true
    side_effect: preview

  payroll.approval_summary:
    label: "生成审批摘要"
    kind: navigate
    target:
      module: payroll
      focus: approval

  payroll.build_snapshot_status:
    label: "查看薪资快照状态"
    kind: ontology_function
    target:
      function: build_payroll_snapshot
    params:
      payroll_run_id: "{context.payroll_run_id}"
    side_effect: preview

  payroll.generate_lines_preview:
    label: "预览工资明细生成"
    kind: ontology_function
    target:
      function: generate_payroll_lines
    params:
      payroll_run_id: "{context.payroll_run_id}"
    side_effect: preview

  payroll.import_attendance:
    label: "导入考勤补扣"
    kind: ontology_function
    target:
      function: import_attendance_adjustments
    params:
      payroll_run_id: "{context.payroll_run_id}"
      source_file: ""
    enabled: false
    disabled_reason: "需要上传文件和导入映射；当前原型尚未实现文件导入。"
    side_effect: mutation

  payroll.import_performance:
    label: "导入绩效等级"
    kind: ontology_function
    target:
      function: import_performance_grades
    params:
      payroll_run_id: "{context.payroll_run_id}"
      source_file: ""
    enabled: false
    disabled_reason: "需要上传文件和导入映射；当前原型尚未实现文件导入。"
    side_effect: mutation

  payroll.validate:
    label: "校验薪资批次"
    kind: ontology_function
    target:
      function: validate_payroll
    params:
      payroll_run_id: "{context.payroll_run_id}"
    enabled: false
    disabled_reason: "当前原型尚未实现 validate_payroll。"
    side_effect: preview

  payroll.submit_approval:
    label: "提交薪资审批"
    kind: workflow
    target:
      function: submit_payroll_for_approval
    params:
      payroll_run_id: "{context.payroll_run_id}"
    enabled: false
    disabled_reason: "需要先完成校验并实现审批工作流。"
    requires_confirmation: true
    side_effect: workflow

  payroll.export_outputs:
    label: "导出薪资结果"
    kind: export
    target:
      function: export_payroll_outputs
    params:
      payroll_run_id: "{context.payroll_run_id}"
      export_type: "payroll_summary"
    enabled: false
    disabled_reason: "导出要求批次锁定，且当前原型尚未实现导出动作。"
    requires_confirmation: true
    side_effect: export

  payroll.generate_payslips:
    label: "生成工资条"
    kind: ontology_function
    target:
      function: generate_payslips
    params:
      payroll_run_id: "{context.payroll_run_id}"
    enabled: false
    disabled_reason: "ontology 已定义工资条生成，但运行时函数尚未实现。"
    side_effect: preview

  employee.explain_payroll:
    label: "生成工资说明"
    kind: api_call
    target:
      endpoint: /api/explain/payroll
      employee_id: "{context.employee_id}"

  employee.calculate_payroll_preview:
    label: "试算该员工薪资"
    kind: ontology_function
    target:
      function: calculate_payroll
    params:
      payroll_run_id: "{context.payroll_run_id}"
      employee_id: "{context.employee_id}"
    side_effect: preview

  employee.calculate_contributions_preview:
    label: "试算该员工社保公积金"
    kind: ontology_function
    target:
      function: calculate_contributions
    params:
      payroll_run_id: "{context.payroll_run_id}"
      employee_id: "{context.employee_id}"
    side_effect: preview

  employee.resolve_state:
    label: "解析员工时点状态"
    kind: ontology_function
    target:
      function: resolve_employee_state_at
    params:
      employee_id: "{context.employee_id}"
      as_of_date: "{context.as_of_date}"
    side_effect: read_only

  company.resolve_rules:
    label: "解析公司月份规则"
    kind: ontology_function
    target:
      function: resolve_rules_at
    params:
      company_id: "{context.company_id}"
      period: "{context.period}"
    side_effect: read_only

  resources.relationships:
    label: "查看任职关系"
    kind: navigate
    target:
      module: ontology
      object_type: EmploymentRelationship

  resources.salary_profiles:
    label: "查看薪资档案版本"
    kind: navigate
    target:
      module: ontology
      object_type: SalaryProfile

  resources.attendance:
    label: "查看考勤汇总"
    kind: navigate
    target:
      module: ontology
      object_type: AttendanceSummary

  resources.performance:
    label: "查看绩效记录"
    kind: navigate
    target:
      module: ontology
      object_type: PerformanceRecord

  resources.adjustments:
    label: "查看补扣调整"
    kind: navigate
    target:
      module: ontology
      object_type: PayrollAdjustment

  resources.contribution_deductions:
    label: "查看扣款台账"
    kind: navigate
    target:
      module: ontology
      object_type: ContributionDeduction

  resources.tax_ledger:
    label: "查看个税台账"
    kind: navigate
    target:
      module: ontology
      object_type: TaxLedger

  resources.rules:
    label: "查看薪资规则"
    kind: navigate
    target:
      module: ontology
      object_type: SalarySplitRule

  resources.payslips:
    label: "查看工资条"
    kind: navigate
    target:
      module: ontology
      object_type: Payslip

  resources.cost_entries:
    label: "查看成本归集"
    kind: navigate
    target:
      module: ontology
      object_type: CostEntry

  resources.approvals:
    label: "查看审批记录"
    kind: navigate
    target:
      module: ontology
      object_type: ApprovalRecord

  consultant.calculate_fees:
    label: "计算顾问劳务费"
    kind: ontology_function
    target:
      function: calculate_consultant_fees
    params:
      settlement_period: "2026-04"
      company_id: ""
    enabled: false
    disabled_reason: "ontology 已建模，但运行时函数尚未实现。"
    side_effect: preview

  cost.generate_entries:
    label: "生成成本归集"
    kind: ontology_function
    target:
      function: generate_cost_entries
    params:
      payroll_run_id: "{context.payroll_run_id}"
    enabled: false
    disabled_reason: "需要先确认薪资结果；当前运行时函数尚未实现。"
    side_effect: preview
