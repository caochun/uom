schema: oms.presentation.v1
description: "OMS shell presentation metadata. It controls which ontology objects are primary resources and how non-primary objects support primary resource pages."

groups:
  - name: "人员与组织"
    objects: [Employee, Company]
  - name: "薪资核算"
    objects: [PayrollRun, PayrollLine, Payslip]
  - name: "顾问与成本"
    objects: [ConsultantEngagement, ConsultantFeeSettlement, CostEntry]
  - name: "治理输出"
    objects: [ApprovalRecord, PayrollExport]

objects:
  Person:
    visibility: embedded
    display_name: "自然人信息"
  Employee:
    visibility: primary
    display_name: "员工"
    list_fields: [employee_id, employee_number, department, position, status]
  EmploymentRelationship:
    visibility: history
    display_name: "任职关系"
  Company:
    visibility: primary
    display_name: "公司主体"
    list_fields: [company_id, company_name, payroll_enabled, tax_entity_name]
  InternalAffiliation:
    visibility: embedded
    display_name: "内部归属"
  SalaryProfile:
    visibility: history
    display_name: "薪资档案版本"
  PayrollRun:
    visibility: primary
    display_name: "月度薪资批次"
    list_fields: [payroll_run_id, payroll_period, pay_date, status]
  PayrollInputSnapshot:
    visibility: evidence
    display_name: "薪资输入快照"
  PayrollEmployeeSnapshot:
    visibility: evidence
    display_name: "员工薪资输入快照"
  PayrollLine:
    visibility: primary
    display_name: "员工月度工资明细"
    list_fields: [payroll_line_id, employee_id, employee_name_snapshot, gross_pay_before_deduction, net_pay]
  PayrollItem:
    visibility: evidence
    display_name: "工资项明细"
  AttendanceSummary:
    visibility: embedded
    display_name: "月度考勤汇总"
  PerformanceRecord:
    visibility: embedded
    display_name: "月度绩效记录"
  PayrollAdjustment:
    visibility: embedded
    display_name: "工资补扣调整"
  SocialInsuranceContribution:
    visibility: embedded
    display_name: "社保缴费记录"
  HousingFundContribution:
    visibility: embedded
    display_name: "公积金缴费记录"
  ContributionDeduction:
    visibility: evidence
    display_name: "社保公积金扣款台账"
  TaxLedger:
    visibility: embedded
    display_name: "工资薪金个税累计台账"
  ConsultantEngagement:
    visibility: primary
    display_name: "顾问服务关系"
  ConsultantFeeSettlement:
    visibility: primary
    display_name: "顾问劳务费结算"
  Payslip:
    visibility: primary
    display_name: "工资条"
  CostEntry:
    visibility: primary
    display_name: "人力成本归集"
  PayrollValidationResult:
    visibility: evidence
    display_name: "薪资校验结果"
  ApprovalRecord:
    visibility: primary
    display_name: "薪资审批记录"
  PayrollExport:
    visibility: primary
    display_name: "薪资导出记录"
  SalarySplitRule:
    visibility: admin_config
    display_name: "岗位薪资拆分规则"
  PerformanceGradeRule:
    visibility: admin_config
    display_name: "绩效等级系数规则"
  SocialInsuranceRule:
    visibility: admin_config
    display_name: "社保比例和上下限规则"
  HousingFundRule:
    visibility: admin_config
    display_name: "公积金比例规则"
  TaxRateRule:
    visibility: admin_config
    display_name: "累计预扣个税税率规则"
