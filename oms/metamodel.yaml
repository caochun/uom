schema: oms.metamodel.v1

metamodel:
  name: OMS Minimal Metamodel
  version: 1.0.0
  description: >-
    定义业务语义层使用的最小语言，只说明如何定义概念、关系、属性和函数，
    不包含企业经营概念，也不规定图数据库、关系数据库或页面结构。

elements:
  Concept:
    purpose: 定义具有独立业务身份的事物或经济事实。
    required: [name, description]
    optional: [properties]

  Relation:
    purpose: 定义概念之间可独立记录的业务关联，关联金额等事实放在 properties 中。
    required: [from, predicate, to, description]
    optional: [cardinality, properties]
    defaults: {cardinality: many_to_many}

  Property:
    purpose: 定义 LLM 判断金额、期间、状态和类别所需的最少事实。
    format: "property_name: value_type"

  Function:
    purpose: 定义基于概念和关系进行追溯、汇总和解释的运行时能力。
    required: [description, inputs, returns, reads]
    optional: [instructions]

value_types:
  string: 文本、枚举值或状态代码
  number: 普通数值
  date: 日期，格式 YYYY-MM-DD
  period: 经营期间，格式 YYYY-MM
  money: "金额对象，格式 {amount: number, currency: string}"
  json: MVP 暂不展开的结构化事实

cardinalities: [one_to_one, one_to_many, many_to_one, many_to_many]

data_contract:
  object:
    required: [id, type, name]
    optional: [facts, source_refs]
  relation:
    required: [id, type, from, to]
    optional: [facts, source_refs]

constraints:
  - 定义 ID 使用稳定的 ASCII snake_case，数据 ID 使用稳定的 ASCII 标识。
  - 只有具有独立身份的业务事实才定义为 Concept；核销、拆分和归因定义为 Relation。
  - 数据 facts 只能使用对应 Concept 或 Relation 声明的 Property。
  - source_refs 只记录合同、项目、工资单、采购单等来源对象，不把来源系统结构复制进本体。
  - Function.reads 必须引用已定义的 Concept 或 Relation。
  - Graph、Node、Edge、表、页面和报表都不是元模型元素。
