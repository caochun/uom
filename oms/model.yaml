schema: oms.business_model.v2

model:
  name: OMS 高速联网收费领域模型
  version: 3.1.0
  description: >-
    面向高速联网收费业务追溯的精简对象关系模型。模型保留路网、车辆与通行介质、
    通行交易、拆分清分、客服资金、费率和运行控制的核心语义，不复刻业务系统表结构。

property_definitions:
  status:
    name: 状态
    type: string
    description: 对象或关系当前所处的业务状态。
  category:
    name: 类别
    type: string
    description: 同一对象类型下的业务分类，例如主体角色、设备种类或资金交易种类。
  role:
    name: 关系角色
    type: string
    description: 关系端点在当前业务联系中承担的角色。
  code:
    name: 编码
    type: string
    description: 来源系统或行业规范中的稳定业务编码。
  reference_no:
    name: 业务流水号
    type: string
    description: 通行、交易、拆分、账单或清分结果的来源流水号。
  amount:
    name: 金额
    type: money
    description: 由数值和 ISO 币种组成的金额。
  occurred_on:
    name: 发生日期
    type: date
    description: 业务事实实际发生的日期。
  valid_from:
    name: 生效日期
    type: date
    description: 规则、名单、介质或设施开始有效的日期。
  valid_to:
    name: 失效日期
    type: date
    description: 规则、名单、介质或设施结束有效的日期。
  period:
    name: 业务期间
    type: period
    description: 汇总事实所属月份，格式为 YYYY-MM。
  vehicle_type:
    name: 车型
    type: string
    description: 联网收费口径下的车辆类型。
  plate_no:
    name: 车牌号
    type: string
    description: 车辆或牌识事实使用的车牌标识，展示时应按权限脱敏。
  direction:
    name: 方向
    type: string
    description: 上行、下行、入口或出口等业务方向。
  mileage:
    name: 里程
    type: number
    description: 路段、收费单元或路径的里程。
  version:
    name: 版本
    type: string
    description: 费率、名单或运行参数的业务版本。
  stage:
    name: 通行阶段
    type: string
    description: 入口、门架或出口等通行交易和牌识阶段。
  mode:
    name: 通行方式
    type: string
    description: ETC 或 MTC 通行收费方式；实际使用的 OBU、CPC 卡或纸券由关系表达。
  channel:
    name: 办理渠道
    type: string
    description: 网点、终端、线上或其他业务办理渠道。
  result:
    name: 处理结果
    type: string
    description: 查验、计费、结算或对账形成的业务结论。
  reason:
    name: 原因
    type: string
    description: 调整、冲正、名单纳入或异常处理的业务原因。
  quantity:
    name: 数量
    type: number
    description: 库存或业务汇总中的数量。
  details:
    name: 补充信息
    type: json
    description: 尚未稳定为公共属性的结构化业务事实。

object_types:
  party:
    name: 业务主体
    description: >-
      参与联网收费运营的组织或人员；通过 category 区分收费公路业主、发行服务机构、
      省联网中心、部联网中心、客服合作机构或操作员。ETC 开户客户单独使用 user 表达。
    properties:
      category: {required: false}
      code: {required: false}
      status: {required: false}
      details: {required: false}
  user:
    name: 客户
    description: ETC 发行服务中的开户客户，是户、车、卡、签关系的客户侧起点。
    properties:
      reference_no: {required: true}
      status: {required: false}
      details: {required: false}
  vehicle:
    name: 车辆
    description: 高速公路通行和收费识别的核心业务主体。
    properties:
      plate_no: {required: true}
      vehicle_type: {required: true}
      status: {required: false}
      details: {required: false}
  obu:
    name: OBU 电子标签
    description: 安装在车辆上的 ETC 识别与交易认证设备，与车辆形成长期绑定关系。
    properties:
      category: {required: false}
      code: {required: true}
      status: {required: false}
      valid_from: {required: false}
      valid_to: {required: false}
      details: {required: false}
  etc_card:
    name: ETC 卡
    description: ETC 用户身份和支付凭证，与车辆及卡资金账户形成长期业务关系。
    properties:
      category: {required: false}
      code: {required: true}
      status: {required: false}
      valid_from: {required: false}
      valid_to: {required: false}
      details: {required: false}
  cpc_card:
    name: CPC 卡
    description: MTC 车辆入口领取、出口交回的可重复使用通行介质，只与一次通行临时关联。
    properties:
      code: {required: true}
      status: {required: false}
      valid_from: {required: false}
      valid_to: {required: false}
      details: {required: false}
  paper_ticket:
    name: 纸券
    description: 入口临时发放、出口凭券计费溯源的纸质通行凭证，只与一次通行临时关联。
    properties:
      code: {required: true}
      status: {required: false}
      valid_from: {required: false}
      valid_to: {required: false}
      details: {required: false}
  toll_road:
    name: 收费公路
    description: 聚合收费路段并承载全路基本信息的顶层道路资源。
    properties:
      code: {required: true}
      status: {required: false}
      details: {required: false}
  section:
    name: 收费路段
    description: 具有统一经营管理主体和收费性质的连续路段区间。
    properties:
      code: {required: true}
      mileage: {required: false}
      status: {required: false}
      details: {required: false}
  toll_interval:
    name: 收费单元
    description: 按方向承载费率、执行分段计费和费用拆分的最小路网单元。
    properties:
      code: {required: true}
      direction: {required: false}
      mileage: {required: false}
      status: {required: false}
      details: {required: false}
  toll_station:
    name: 收费站
    description: 车辆进出收费公路并完成介质处理、交易和查验的服务节点。
    properties:
      code: {required: true}
      status: {required: false}
      details: {required: false}
  toll_plaza:
    name: 收费广场
    description: 收费站内连接道路与收费车道的车辆组织区域。
    properties:
      code: {required: true}
      direction: {required: false}
      status: {required: false}
      details: {required: false}
  toll_lane:
    name: 收费车道
    description: ETC、MTC、混合或自助收费交易的最终执行点。
    properties:
      code: {required: true}
      category: {required: true}
      direction: {required: false}
      status: {required: false}
      details: {required: false}
  toll_gantry:
    name: 收费门架
    description: 沿线执行分段计费、介质读写和车辆识别的门架系统。
    properties:
      code: {required: true}
      direction: {required: false}
      status: {required: false}
      details: {required: false}
  service_facility:
    name: 服务设施或渠道
    description: >-
      发行服务和拓展支付的设施；通过 category 区分服务区、停车场、加油站、
      站前预交易设施、营业网点、流动服务点、自助终端和线上渠道。
    properties:
      category: {required: true}
      code: {required: false}
      channel: {required: false}
      status: {required: false}
      details: {required: false}
  business_device:
    name: 业务设备
    description: >-
      部署于中心、收费站、车道或门架的设备；设备类别、技术参数和运行信息保存在
      category 与 details 中，不为每种硬件建立独立对象类型。
    properties:
      category: {required: true}
      code: {required: true}
      status: {required: false}
      details: {required: false}
  passage:
    name: 通行记录
    description: 聚合一次完整通行中的车辆、所用介质、入口、门架、出口交易和牌识事实。
    properties:
      reference_no: {required: true}
      mode: {required: true}
      occurred_on: {required: true}
      status: {required: false}
      vehicle_type: {required: false}
      details: {required: false}
  toll_transaction:
    name: 通行交易记录
    description: >-
      入口、门架或出口产生的交易事实；通过 stage 区分阶段，金额只在实际产生计费时记录。
    properties:
      reference_no: {required: true}
      stage: {required: true}
      occurred_on: {required: true}
      amount: {required: false}
      status: {required: false}
      details: {required: false}
  vehicle_id_record:
    name: 车辆识别记录
    description: 入口、门架或出口形成的车牌和车辆识别事实。
    properties:
      reference_no: {required: true}
      stage: {required: true}
      occurred_on: {required: true}
      plate_no: {required: false}
      result: {required: false}
      details: {required: false}
  vehicle_check_result:
    name: 预约车辆查验结果
    description: 绿通、大件运输等预约车辆在出口形成的查验结论。
    properties:
      reference_no: {required: true}
      occurred_on: {required: true}
      result: {required: true}
      details: {required: false}
  second_charge_result:
    name: 二次计费结果
    description: 特殊通行在查验或省级优惠处理后重新计算形成的费额结果。
    properties:
      reference_no: {required: true}
      amount: {required: true}
      occurred_on: {required: true}
      result: {required: true}
      details: {required: false}
  split_record:
    name: 省内拆分记录
    description: 按通行路径和收费单元对一次通行费进行拆分计算的结果。
    properties:
      reference_no: {required: true}
      amount: {required: true}
      occurred_on: {required: true}
      status: {required: false}
      details: {required: false}
  split_basis:
    name: 拆分依据
    description: 一项拆分所采用的路径、费率版本和计算规则。
    properties:
      version: {required: false}
      details: {required: true}
  split_detail:
    name: 拆分明细
    description: 一项拆分中归属于具体收费单元或业主的金额明细。
    properties:
      amount: {required: true}
      details: {required: false}
  clearing_result:
    name: 清分结果
    description: 按收费公路业主汇总、用于结算的清分业务结果。
    properties:
      reference_no: {required: true}
      amount: {required: true}
      period: {required: true}
      occurred_on: {required: true}
      status: {required: false}
      details: {required: false}
  invoice_basis_data:
    name: 发票基础数据
    description: 由通行和拆分结果生成、用于开具通行费发票的基础事实。
    properties:
      reference_no: {required: true}
      amount: {required: true}
      occurred_on: {required: true}
      status: {required: false}
      details: {required: false}
  customer_service_record:
    name: 客服业务记录
    description: >-
      客户、车辆、ETC 卡或 OBU 的开户、发行、变更、挂失、激活和注销等办理结果。
    properties:
      category: {required: true}
      reference_no: {required: true}
      occurred_on: {required: true}
      result: {required: true}
      channel: {required: false}
      details: {required: false}
  user_account:
    name: 用户资金账户
    description: 客户级资金账户，不依赖具体 ETC 卡，用于充值资金挂账和向卡账户划转。
    properties:
      reference_no: {required: true}
      status: {required: false}
      details: {required: false}
  card_account:
    name: 卡资金账户
    description: ETC 卡对应的资金账户，用于记录充值、圈存、消费扣款、冲正和退款。
    properties:
      reference_no: {required: true}
      status: {required: false}
      details: {required: false}
  stock_account:
    name: 库存账户
    description: 机构或操作员管理 ETC 卡、OBU、CPC 卡和票据实物库存的数量账本。
    properties:
      category: {required: true}
      reference_no: {required: true}
      status: {required: false}
      details: {required: false}
  account_transaction:
    name: 账户交易
    description: >-
      引起资金账户余额变化的交易；通过 category 区分充值、圈存、冲正、退费、
      退款、补交和账单缴费。
    properties:
      category: {required: true}
      reference_no: {required: true}
      amount: {required: true}
      occurred_on: {required: true}
      status: {required: true}
      reason: {required: false}
      details: {required: false}
  consumption_detail:
    name: ETC 消费明细
    description: ETC 卡消费形成的逐笔应收、实收、优惠和记账事实。
    properties:
      reference_no: {required: true}
      amount: {required: true}
      occurred_on: {required: true}
      status: {required: true}
      details: {required: false}
  bill:
    name: 账单
    description: 对一定期间内消费明细汇总形成的客户应结算结果。
    properties:
      reference_no: {required: true}
      amount: {required: true}
      period: {required: true}
      status: {required: true}
      details: {required: false}
  bill_settlement:
    name: 账单结算结果
    description: 账单经缴费、银行扣款或单位结算后形成的结果。
    properties:
      reference_no: {required: true}
      amount: {required: true}
      occurred_on: {required: true}
      result: {required: true}
      details: {required: false}
  stock_movement:
    name: 库存变化记录
    description: ETC 卡、OBU、CPC 卡或票据在机构与操作员库存间发生的数量变化事实。
    properties:
      category: {required: true}
      reference_no: {required: true}
      quantity: {required: true}
      occurred_on: {required: true}
      reason: {required: false}
      details: {required: false}
  business_day_summary:
    name: 业务日结
    description: 客服机构或操作员一个营业日内的业务和资金汇总结果。
    properties:
      reference_no: {required: true}
      occurred_on: {required: true}
      result: {required: false}
      details: {required: true}
  reconciliation_result:
    name: 对账结果
    description: 业务数据和资金渠道完成核对后形成的一致性结论与差异说明。
    properties:
      reference_no: {required: true}
      occurred_on: {required: true}
      result: {required: true}
      details: {required: false}
  fee_module:
    name: 计费模块
    description: 聚合一组可同时发布和生效的费率、优惠、路径及代收规则。
    properties:
      version: {required: true}
      valid_from: {required: true}
      status: {required: false}
      details: {required: false}
  fee_rule:
    name: 费率或计费规则
    description: >-
      计费模块内的规则项；通过 category 区分基础费率、省级费率、优惠策略、
      代收关系、省界关系和最小费额路径。
    properties:
      category: {required: true}
      code: {required: false}
      version: {required: false}
      valid_from: {required: false}
      valid_to: {required: false}
      details: {required: true}
  control_record:
    name: 业务控制记录
    description: >-
      针对车辆、OBU、ETC 卡、CPC 卡或业务设备生效的控制事实；通过 category 区分
      状态名单、追缴名单、预约、关注名单和白名单。
    properties:
      category: {required: true}
      code: {required: false}
      status: {required: true}
      version: {required: false}
      valid_from: {required: false}
      valid_to: {required: false}
      reason: {required: false}
      details: {required: false}
  operating_parameter:
    name: 运行参数
    description: 控制收费站、车道、门架或联网中心运行方式的版本化配置，不代表名单成员。
    properties:
      category: {required: true}
      code: {required: false}
      status: {required: true}
      version: {required: false}
      valid_from: {required: false}
      valid_to: {required: false}
      details: {required: true}

relation_types:
  contains:
    name: 包含
    description: >-
      from 是整体，to 是依附于整体的组成部分；用于路网层级、设施设备、拆分明细和费率包。
    from_types:
      [party, toll_road, section, toll_station, toll_plaza, toll_lane, toll_gantry,
       service_facility, split_record, fee_module]
    to_types:
      [section, toll_interval, toll_station, toll_plaza, toll_lane, toll_gantry,
       service_facility, business_device, split_basis, split_detail, fee_rule]
    properties:
      role: {required: false}
  references:
    name: 引用
    description: >-
      from 业务记录使用 to 独立对象提供的信息；被引用对象不依附于引用者存在。
    from_types:
      [passage, toll_transaction, vehicle_id_record, vehicle_check_result, split_detail,
       account_transaction, consumption_detail, bill_settlement, stock_movement,
       reconciliation_result, fee_rule, control_record, operating_parameter]
    properties:
      role: {required: true}
      amount: {required: false}
  associates:
    name: 关联
    description: 两个可独立存在的对象之间形成业务联系，例如户车、车卡签、业主路段和账户归属。
    properties:
      role: {required: true}
      status: {required: false}
  derives:
    name: 派生
    description: >-
      from 是来源事实，to 是由其计算、汇总或处理生成的结果；方向统一为“来源到结果”。
    from_types:
      [passage, vehicle_check_result, split_record, account_transaction,
       consumption_detail, bill, bill_settlement]
    to_types:
      [second_charge_result, split_record, clearing_result, invoice_basis_data,
       bill, bill_settlement, business_day_summary, reconciliation_result]
    acyclic: true
    properties:
      role: {required: false}
      amount: {required: false}
      reason: {required: false}

actions:
  register_party:
    name: 登记业务主体
    description: 登记业主、发行机构、联网中心、客服机构或操作员等业务主体。
    icon: building_2
    handler: changeset
    confirmation: 登记新的联网收费业务主体。
    inputs:
      name: {name: 主体名称, type: string, required: true}
      category: {name: 主体类别, property: category, required: true}
      code: {name: 主体编码, property: code, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 补充信息, property: details, required: false}
    effects:
      - create_object:
          ref: party
          type: party
          name: $input.name
          properties:
            category: $input.category
            code: $input.code
            status: $input.status
            details: $input.details

  register_user:
    name: 登记客户
    description: 登记 ETC 发行服务中的开户客户。
    icon: user_round
    handler: changeset
    confirmation: 登记新的客户账户主体。
    inputs:
      name: {name: 客户名称, type: string, required: true}
      reference_no: {name: 客户编号, property: reference_no, required: true}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 补充信息, property: details, required: false}
    effects:
      - create_object:
          ref: user
          type: user
          name: $input.name
          properties:
            reference_no: $input.reference_no
            status: $input.status
            details: $input.details

  register_vehicle:
    name: 登记车辆
    description: 在当前客户名下登记车辆并建立户车关系。
    icon: car_front
    handler: changeset
    available_on: [user]
    confirmation: 登记车辆并关联当前客户。
    inputs:
      name: {name: 车辆名称, type: string, required: true}
      plate_no: {name: 车牌号, property: plate_no, required: true}
      vehicle_type: {name: 车型, property: vehicle_type, required: true}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 补充信息, property: details, required: false}
    effects:
      - create_object:
          ref: vehicle
          type: vehicle
          name: $input.name
          properties:
            plate_no: $input.plate_no
            vehicle_type: $input.vehicle_type
            status: $input.status
            details: $input.details
      - create_relation:
          type: associates
          from: $context
          to: $vehicle
          properties: {role: owned_vehicle, status: active}

  issue_etc_card:
    name: 发行 ETC 卡
