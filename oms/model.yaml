schema: oms.business_model.v2

model:
  name: OMS 高速公路经营事实模型
  version: 1.0.0
  description: >-
    用对象和关系追溯收费公路的路网、车辆通行、收费清分、收入、养护成本与实际资金。
    本模型只保留高速公路经营 MVP 所需词汇，不复刻收费系统、路网系统或财务系统表结构。

property_definitions:
  status:
    name: 状态
    type: string
    description: 对象或关系当前所处的业务状态。
  category:
    name: 类别
    type: string
    description: 同一对象类型下的业务分类。
  roles:
    name: 业务角色
    type: json
    description: 一个组织承担的运营方、服务商、供应商或付款方等角色。
  role:
    name: 关系角色
    type: string
    description: 对象在一项关系中承担的角色。
  code:
    name: 编码
    type: string
    description: 公路、路段或收费站的业务编码。
  reference_no:
    name: 业务编号
    type: string
    description: 通行、交易、清分或凭据的来源编号。
  amount:
    name: 金额
    type: money
    description: 由数值和 ISO 币种组成的金额。
  mileage:
    name: 里程
    type: number
    description: 路段或通行对应的里程，通常以公里为单位。
  vehicle_type:
    name: 车型
    type: string
    description: 收费口径使用的车辆分类。
  direction:
    name: 行驶方向
    type: string
    description: 上行、下行或双向等方向。
  period:
    name: 经营期间
    type: period
    description: 事实归属月份，格式为 YYYY-MM。
  occurred_on:
    name: 发生日期
    type: date
    description: 业务事实实际发生的日期。
  due_on:
    name: 到期日期
    type: date
    description: 应收或应付约定的到期日期。
  start_date:
    name: 开始日期
    type: date
    description: 公路经营或业务对象有效期的开始日期。
  basis:
    name: 业务依据
    type: string
    description: 建立来源、核销或金额对应关系所依据的事实。
  details:
    name: 补充信息
    type: json
    description: 费率路径、位置、车牌脱敏值或其他尚未稳定的结构化事实。
  event_level:
    name: 事件等级
    type: string
    description: 路况事件对通行与经营的影响等级。

object_types:
  party:
    name: 业务组织
    description: 参与高速公路经营的运营方、服务商、供应商或资金往来方。
    properties:
      roles: {required: true}
      status: {required: false}
  highway:
    name: 收费公路
    description: 企业负责投资、运营或收费管理的一条高速公路。
    properties:
      code: {required: true}
      category: {required: false}
      status: {required: false}
      start_date: {required: false}
  road_section:
    name: 公路路段
    description: 收费公路中可独立管理、核算和追溯的路段。
    properties:
      code: {required: true}
      mileage: {required: false}
      direction: {required: false}
      status: {required: false}
  toll_station:
    name: 收费站
    description: 车辆进入或离开收费公路时记录通行和收费的站点。
    properties:
      code: {required: true}
      category: {required: false}
      status: {required: false}
  vehicle_passage:
    name: 车辆通行
    description: 一辆车在入口、出口和发生日期上的实际通行事实。
    properties:
      reference_no: {required: true}
      vehicle_type: {required: true}
      occurred_on: {required: true}
      direction: {required: false}
      status: {required: false}
      details: {required: false}
  toll_transaction:
    name: 通行费交易
    description: 根据车辆通行与费率口径计算出的单笔应计收费事实。
    properties:
      reference_no: {required: true}
      amount: {required: true}
      occurred_on: {required: true}
      period: {required: false}
      status: {required: false}
      details: {required: false}
  settlement_batch:
    name: 收费清分批次
    description: 将通行费交易汇总并形成运营方收入或应收依据的清分结果。
    properties:
      reference_no: {required: true}
      amount: {required: true}
      period: {required: true}
      occurred_on: {required: true}
      status: {required: false}
      details: {required: false}
  revenue:
    name: 通行费收入
    description: 企业依据通行费交易或清分结果确认的经济利益，不代表现金已经到账。
    properties:
      category: {required: false}
      amount: {required: true}
      period: {required: false}
      occurred_on: {required: false}
      status: {required: false}
  receivable:
    name: 收费应收
    description: 已经形成但尚未完全收回的通行费收款权利。
    properties:
      amount: {required: true}
      occurred_on: {required: true}
      due_on: {required: false}
      status: {required: false}
  cash_receipt:
    name: 实际收款
    description: 已经实际进入运营企业资金账户的现金流入。
    properties:
      amount: {required: true}
      occurred_on: {required: true}
      status: {required: false}
  maintenance_work:
    name: 养护作业
    description: 对路段或收费站实施的日常养护、专项维修或改扩建作业。
    properties:
      category: {required: true}
      amount: {required: false}
      occurred_on: {required: true}
      period: {required: false}
      status: {required: false}
      details: {required: false}
  cost:
    name: 运营成本
    description: 养护或其他运营活动已经消耗的资源，可对应收入，也可由企业承担。
    properties:
      category: {required: false}
      amount: {required: true}
      period: {required: false}
      occurred_on: {required: false}
      status: {required: false}
  payable:
    name: 运营应付
    description: 养护或其他运营活动已经形成但尚未完全支付的付款义务。
    properties:
      amount: {required: true}
      occurred_on: {required: true}
      due_on: {required: false}
      status: {required: false}
  cash_payment:
    name: 实际付款
    description: 已经实际离开运营企业资金账户的现金流出。
    properties:
      amount: {required: true}
      occurred_on: {required: true}
      status: {required: false}
  road_event:
    name: 路况事件
    description: 影响道路通行、收费或运营安全的事故、拥堵、施工或自然灾害。
    properties:
      category: {required: true}
      event_level: {required: false}
      occurred_on: {required: true}
      status: {required: false}
      details: {required: false}
  evidence:
    name: 业务凭据
    description: 说明通行、清分、养护、收付款或其他经营事实的材料。
    properties:
      category: {required: true}
      reference_no: {required: false}
      occurred_on: {required: false}
      status: {required: false}
      details: {required: false}

relation_types:
  involves:
    name: 涉及组织
    description: from 经营对象涉及 to 组织；role 说明运营方、付款方、供应商或债权人身份。
    to_types: [party]
    properties:
      role: {required: true}
  contains:
    name: 包含
    description: 收费公路包含路段，路段包含收费站。
    from_types: [highway, road_section]
    to_types: [road_section, toll_station]
    properties:
      role: {required: true}
  derived_from:
    name: 来源于
    description: from 对象由 to 对象产生、汇总、确认或转换而来。
    acyclic: true
    properties:
      basis: {required: false}
  occurred_at:
    name: 发生于
    description: 车辆通行、养护作业或路况事件发生在某个路段或收费站。
    from_types: [vehicle_passage, maintenance_work, road_event]
    to_types: [road_section, toll_station]
    properties:
      role: {required: true}
  affects:
    name: 影响
    description: 养护作业或路况事件对公路、路段或收费站产生影响。
    from_types: [maintenance_work, road_event]
    to_types: [highway, road_section, toll_station]
    properties:
      role: {required: true}
      status: {required: false}
  allocated_to:
    name: 金额对应
    description: 将成本对应收入、收款核销应收，或付款核销应付。
    from_types: [cost, cash_receipt, cash_payment]
    to_types: [revenue, receivable, payable]
    properties:
      amount: {required: true}
      status: {required: true}
      occurred_on: {required: true}
      period: {required: false}
      basis: {required: false}
  evidenced_by:
    name: 由凭据说明
    description: from 经营事实由 to 凭据提供可追溯说明。
    to_types: [evidence]
    properties:
      basis: {required: false}

actions:
  register_party:
    name: 登记业务组织
    description: 登记运营方、服务商、供应商或其他资金往来方。
    icon: building_2
    handler: changeset
    confirmation: 登记新的业务组织。
    inputs:
      name: {name: 组织名称, type: string, required: true}
      roles: {name: 业务角色, property: roles, required: true}
      status: {name: 状态, property: status, required: false}
    effects:
      - create_object:
          ref: party
          type: party
          name: $input.name
          properties: {roles: $input.roles, status: $input.status}

  register_highway:
    name: 登记收费公路
    description: 登记一条由企业负责运营或收费管理的高速公路。
    icon: route
    handler: changeset
    confirmation: 登记收费公路并建立运营主体关系。
    inputs:
      name: {name: 公路名称, type: string, required: true}
      code: {name: 公路编码, property: code, required: true}
      operator_id: {name: 运营主体, object_types: [party], required: true}
      category: {name: 公路类别, property: category, required: false}
      status: {name: 状态, property: status, required: false, default: operating}
      start_date: {name: 开始日期, property: start_date, required: false}
    effects:
      - create_object:
          ref: highway
          type: highway
          name: $input.name
          properties:
            code: $input.code
            category: $input.category
            status: $input.status
            start_date: $input.start_date
      - create_relation:
          type: involves
          from: $highway
          to: $input.operator_id
          properties: {role: operator}

  register_road_section:
    name: 登记公路路段
    description: 在当前收费公路下登记一个可管理和核算的路段。
    icon: between_horizontal_start
    handler: changeset
    available_on: [highway]
    confirmation: 登记路段并纳入当前收费公路。
    inputs:
      name: {name: 路段名称, type: string, required: true}
      code: {name: 路段编码, property: code, required: true}
      mileage: {name: 路段里程, property: mileage, required: false}
      direction: {name: 行驶方向, property: direction, required: false}
      status: {name: 状态, property: status, required: false, default: operating}
    effects:
      - create_object:
          ref: section
          type: road_section
          name: $input.name
          properties:
            code: $input.code
            mileage: $input.mileage
            direction: $input.direction
            status: $input.status
      - create_relation:
          type: contains
          from: $context
          to: $section
          properties: {role: road_section}

  register_toll_station:
    name: 登记收费站
    description: 在当前公路路段下登记车辆进出和收费发生的站点。
    icon: signpost
    handler: changeset
    available_on: [road_section]
    confirmation: 登记收费站并纳入当前路段。
    inputs:
      name: {name: 收费站名称, type: string, required: true}
      code: {name: 收费站编码, property: code, required: true}
      category: {name: 站点类别, property: category, required: false}
      status: {name: 状态, property: status, required: false, default: operating}
    effects:
      - create_object:
          ref: station
          type: toll_station
          name: $input.name
          properties:
            code: $input.code
            category: $input.category
            status: $input.status
      - create_relation:
          type: contains
          from: $context
          to: $station
          properties: {role: toll_station}

  record_vehicle_passage:
    name: 登记车辆通行
    description: 以当前收费站为入口登记车辆通行，并记录出口收费站。
    icon: car_front
    handler: changeset
    available_on: [toll_station]
    confirmation: 登记车辆通行并关联入口、出口收费站。
    inputs:
      reference_no: {name: 通行流水号, property: reference_no, required: true}
      vehicle_type: {name: 车型, property: vehicle_type, required: true}
      exit_station_id: {name: 出口收费站, object_types: [toll_station], required: true}
      occurred_on: {name: 通行日期, property: occurred_on, required: true}
      direction: {name: 行驶方向, property: direction, required: false}
      details: {name: 通行详情, property: details, required: false}
    effects:
      - create_object:
          ref: passage
          type: vehicle_passage
          name: $input.reference_no
          properties:
            reference_no: $input.reference_no
            vehicle_type: $input.vehicle_type
            occurred_on: $input.occurred_on
            direction: $input.direction
            status: recorded
            details: $input.details
      - create_relation:
          type: occurred_at
          from: $passage
          to: $context
          properties: {role: entry_station}
      - create_relation:
          type: occurred_at
          from: $passage
          to: $input.exit_station_id
          properties: {role: exit_station}

  record_toll_transaction:
    name: 记录通行费交易
    description: 根据当前车辆通行登记应计通行费，不直接等同于已经到账的收入。
    icon: receipt
    handler: changeset
    available_on: [vehicle_passage]
    confirmation: 记录通行费交易并追溯到车辆通行。
    inputs:
      reference_no: {name: 交易流水号, property: reference_no, required: true}
      amount: {name: 应计费额, property: amount, required: true}
      occurred_on: {name: 计费日期, property: occurred_on, required: true}
      period: {name: 经营期间, property: period, required: false}
      status: {name: 状态, property: status, required: false, default: calculated}
      details: {name: 计费详情, property: details, required: false}
    effects:
      - create_object:
          ref: transaction
          type: toll_transaction
          name: $input.reference_no
          properties:
            reference_no: $input.reference_no
            amount: $input.amount
            occurred_on: $input.occurred_on
            period: $input.period
            status: $input.status
            details: $input.details
      - create_relation:
          type: derived_from
          from: $transaction
          to: $context
          properties: {basis: passage_rating}

  record_settlement_batch:
    name: 登记收费清分
    description: 将当前通行费交易汇总为清分批次，作为收入或应收的依据。
    icon: layers_3
    handler: changeset
    available_on: [toll_transaction]
    confirmation: 登记收费清分并追溯到当前交易。
    inputs:
      reference_no: {name: 清分批次号, property: reference_no, required: true}
      amount: {name: 清分金额, property: amount, required: true}
      period: {name: 经营期间, property: period, required: true}
      occurred_on: {name: 清分日期, property: occurred_on, required: true}
      status: {name: 状态, property: status, required: false, default: settled}
      details: {name: 清分详情, property: details, required: false}
    effects:
      - create_object:
          ref: batch
          type: settlement_batch
          name: $input.reference_no
          properties:
            reference_no: $input.reference_no
            amount: $input.amount
            period: $input.period
            occurred_on: $input.occurred_on
            status: $input.status
            details: $input.details
      - create_relation:
          type: derived_from
          from: $batch
          to: $context
          properties: {basis: toll_clearing}

  recognize_toll_revenue:
    name: 确认通行费收入
    description: 根据当前通行费交易或清分批次确认企业收入。
    icon: badge_check
    handler: changeset
    available_on: [toll_transaction, settlement_batch]
    confirmation: 确认通行费收入并追溯到交易或清分结果。
    inputs:
      name: {name: 收入名称, type: string, required: true}
      amount: {name: 确认金额, property: amount, required: true}
      occurred_on: {name: 确认日期, property: occurred_on, required: true}
      period: {name: 经营期间, property: period, required: true}
      status: {name: 状态, property: status, required: false, default: recognized}
    effects:
      - create_object:
          ref: revenue
          type: revenue
          name: $input.name
          properties:
            category: toll
            amount: $input.amount
            occurred_on: $input.occurred_on
            period: $input.period
            status: $input.status
      - create_relation:
          type: derived_from
          from: $revenue
          to: $context
          properties: {basis: toll_settlement}

  record_receivable:
    name: 登记收费应收
    description: 根据当前收入或清分批次形成对明确付款方的收款权利。
    icon: circle_arrow_down
    handler: changeset
    available_on: [revenue, settlement_batch]
    confirmation: 登记收费应收并建立付款方关系。
    inputs:
      name: {name: 应收名称, type: string, required: true}
      debtor_id: {name: 付款方, object_types: [party], required: true}
      amount: {name: 应收金额, property: amount, required: true}
      occurred_on: {name: 形成日期, property: occurred_on, required: true}
      due_on: {name: 到期日期, property: due_on, required: false}
      status: {name: 状态, property: status, required: false, default: confirmed}
    effects:
      - create_object:
          ref: receivable
          type: receivable
          name: $input.name
          properties:
            amount: $input.amount
            occurred_on: $input.occurred_on
            due_on: $input.due_on
            status: $input.status
      - create_relation:
          type: derived_from
          from: $receivable
          to: $context
          properties: {basis: toll_receivable}
      - create_relation:
          type: involves
          from: $receivable
          to: $input.debtor_id
          properties: {role: debtor}

  record_cash_receipt:
    name: 登记并核销收款
    description: 记录实际到账，并将金额核销到当前收费应收。
    icon: banknote_arrow_down
    handler: changeset
    available_on: [receivable]
    confirmation: 登记收款并核销当前应收。
    inputs:
      name: {name: 收款名称, type: string, required: true}
      amount: {name: 收款金额, property: amount, required: true}
      occurred_on: {name: 到账日期, property: occurred_on, required: true}
      basis: {name: 业务依据, property: basis, required: false}
    effects:
      - create_object:
          ref: receipt
          type: cash_receipt
          name: $input.name
          properties:
            amount: $input.amount
            occurred_on: $input.occurred_on
            status: confirmed
      - create_relation:
          type: allocated_to
          from: $receipt
          to: $context
          properties:
            amount: $input.amount
            occurred_on: $input.occurred_on
            status: confirmed
            basis: $input.basis

  record_maintenance_work:
    name: 登记养护作业
    description: 登记当前路段或收费站发生的养护、维修或改扩建作业。
    icon: construction
    handler: changeset
    available_on: [road_section, toll_station]
    confirmation: 登记养护作业并关联影响范围。
    inputs:
      name: {name: 作业名称, type: string, required: true}
      category: {name: 作业类别, property: category, required: true}
      amount: {name: 预计或实际金额, property: amount, required: false}
      occurred_on: {name: 作业日期, property: occurred_on, required: true}
      period: {name: 经营期间, property: period, required: false}
      status: {name: 状态, property: status, required: false, default: in_progress}
      details: {name: 作业详情, property: details, required: false}
    effects:
      - create_object:
          ref: work
          type: maintenance_work
          name: $input.name
          properties:
            category: $input.category
            amount: $input.amount
            occurred_on: $input.occurred_on
            period: $input.period
            status: $input.status
            details: $input.details
      - create_relation:
          type: affects
          from: $work
          to: $context
          properties: {role: maintenance_scope}

  record_highway_cost:
    name: 登记运营成本
    description: 将当前养护作业已经发生的资源消耗登记为成本。
    icon: trending_down
    handler: changeset
    available_on: [maintenance_work]
    confirmation: 登记运营成本并追溯到当前养护作业。
    inputs:
      name: {name: 成本名称, type: string, required: true}
      amount: {name: 成本金额, property: amount, required: true}
      occurred_on: {name: 发生日期, property: occurred_on, required: true}
      period: {name: 经营期间, property: period, required: false}
      status: {name: 状态, property: status, required: false, default: confirmed}
    effects:
      - create_object:
          ref: cost
          type: cost
          name: $input.name
          properties:
            category: highway_maintenance
            amount: $input.amount
            occurred_on: $input.occurred_on
            period: $input.period
            status: $input.status
      - create_relation:
          type: derived_from
          from: $cost
          to: $context
          properties: {basis: maintenance_work}

  record_payable:
    name: 登记运营应付
    description: 根据当前养护作业或成本形成对明确债权人的付款义务。
    icon: circle_arrow_up
    handler: changeset
    available_on: [maintenance_work, cost]
    confirmation: 登记运营应付并建立债权人关系。
    inputs:
      name: {name: 应付名称, type: string, required: true}
      creditor_id: {name: 收款方, object_types: [party], required: true}
      amount: {name: 应付金额, property: amount, required: true}
      occurred_on: {name: 形成日期, property: occurred_on, required: true}
      due_on: {name: 到期日期, property: due_on, required: false}
      status: {name: 状态, property: status, required: false, default: confirmed}
    effects:
      - create_object:
          ref: payable
          type: payable
          name: $input.name
          properties:
            amount: $input.amount
            occurred_on: $input.occurred_on
            due_on: $input.due_on
            status: $input.status
      - create_relation:
          type: derived_from
          from: $payable
          to: $context
          properties: {basis: operating_payable}
      - create_relation:
          type: involves
          from: $payable
          to: $input.creditor_id
          properties: {role: creditor}

  record_cash_payment:
    name: 登记并核销付款
    description: 记录实际付款，并将金额核销到当前运营应付。
    icon: banknote_arrow_up
    handler: changeset
    available_on: [payable]
    confirmation: 登记付款并核销当前应付。
    inputs:
      name: {name: 付款名称, type: string, required: true}
      amount: {name: 付款金额, property: amount, required: true}
      occurred_on: {name: 付款日期, property: occurred_on, required: true}
      basis: {name: 业务依据, property: basis, required: false}
    effects:
      - create_object:
          ref: payment
          type: cash_payment
          name: $input.name
          properties:
            amount: $input.amount
            occurred_on: $input.occurred_on
            status: confirmed
      - create_relation:
          type: allocated_to
          from: $payment
          to: $context
          properties:
            amount: $input.amount
            occurred_on: $input.occurred_on
            status: confirmed
            basis: $input.basis

  allocate_cost:
    name: 分配运营成本
    description: 将当前成本的全部或部分金额对应到一项通行费收入。
    icon: split
    handler: changeset
    available_on: [cost]
    confirmation: 将运营成本对应到所选收入。
    inputs:
      revenue_id: {name: 对应收入, object_types: [revenue], required: true}
      amount: {name: 对应金额, property: amount, required: true}
      occurred_on: {name: 确认日期, property: occurred_on, required: true}
      basis: {name: 业务依据, property: basis, required: false}
    effects:
      - create_relation:
          type: allocated_to
          from: $context
          to: $input.revenue_id
          properties:
            amount: $input.amount
            occurred_on: $input.occurred_on
            status: confirmed
            basis: $input.basis

  record_road_event:
    name: 登记路况事件
    description: 登记影响当前路段或收费站通行与收费运营的事件。
    icon: triangle_alert
    handler: changeset
    available_on: [road_section, toll_station]
    confirmation: 登记路况事件并关联影响范围。
    inputs:
      name: {name: 事件名称, type: string, required: true}
      category: {name: 事件类别, property: category, required: true}
      event_level: {name: 事件等级, property: event_level, required: false}
      occurred_on: {name: 发生日期, property: occurred_on, required: true}
      status: {name: 状态, property: status, required: false, default: open}
      details: {name: 事件详情, property: details, required: false}
    effects:
      - create_object:
          ref: event
          type: road_event
          name: $input.name
          properties:
            category: $input.category
            event_level: $input.event_level
            occurred_on: $input.occurred_on
            status: $input.status
            details: $input.details
      - create_relation:
          type: affects
          from: $event
          to: $context
          properties: {role: affected_scope}

  attach_evidence:
    name: 添加业务凭据
    description: 为当前对象登记通行记录、清分文件、养护验收或银行回单等凭据。
    icon: paperclip
    handler: changeset
    available_on: ["*"]
    confirmation: 添加凭据并关联当前对象。
    inputs:
      name: {name: 凭据名称, type: string, required: true}
      category: {name: 凭据类别, property: category, required: true}
      reference_no: {name: 凭据编号, property: reference_no, required: false}
      occurred_on: {name: 凭据日期, property: occurred_on, required: false}
      details: {name: 补充信息, property: details, required: false}
      basis: {name: 业务依据, property: basis, required: false}
    effects:
      - create_object:
          ref: evidence
          type: evidence
          name: $input.name
          properties:
            category: $input.category
            reference_no: $input.reference_no
            occurred_on: $input.occurred_on
            details: $input.details
      - create_relation:
          type: evidenced_by
          from: $context
          to: $evidence
          properties: {basis: $input.basis}
