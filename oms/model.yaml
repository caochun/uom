  add_split_basis:
    name: 添加拆分依据
    description: 为当前拆分结果记录路径、费率版本和计算规则。
    icon: file_check_2
    handler: changeset
    available_on: [split_record]
    confirmation: 添加当前拆分所使用的计算依据。
    inputs:
      name: {name: 依据名称, type: string, required: true}
      version: {name: 费率版本, property: version, required: false}
      details: {name: 路径与规则, property: details, required: true}
    effects:
      - create_object:
          ref: basis
          type: split_basis
          name: $input.name
          properties:
            version: $input.version
            details: $input.details
      - create_relation:
          type: contains
          from: $context
          to: $basis
          properties: {role: split_basis}

  produce_clearing_result:
    name: 生成清分结果
    description: 根据当前拆分记录生成按收费公路业主汇总的清分结果。
    icon: waypoints
    handler: changeset
    available_on: [split_record]
    confirmation: 生成清分结果并追溯到当前拆分记录。
    inputs:
      reference_no: {name: 清分流水号, property: reference_no, required: true}
      amount: {name: 清分金额, property: amount, required: true}
      period: {name: 清分期间, property: period, required: true}
      occurred_on: {name: 清分日期, property: occurred_on, required: true}
      status: {name: 状态, property: status, required: false, default: confirmed}
      details: {name: 清分详情, property: details, required: false}
    effects:
      - create_object:
          ref: clearing
          type: clearing_result
          name: $input.reference_no
          properties:
            reference_no: $input.reference_no
            amount: $input.amount
            period: $input.period
            occurred_on: $input.occurred_on
            status: $input.status
            details: $input.details
      - create_relation:
          type: derives
          from: $context
          to: $clearing
          properties: {role: clearing_result, amount: $input.amount}

  produce_invoice_basis:
    name: 生成发票基础数据
    description: 根据当前拆分记录生成用于开票的基础数据。
    icon: receipt_text
    handler: changeset
    available_on: [split_record]
    confirmation: 生成发票基础数据并追溯到当前拆分记录。
    inputs:
      reference_no: {name: 开票数据流水号, property: reference_no, required: true}
      amount: {name: 开票金额, property: amount, required: true}
      occurred_on: {name: 生成日期, property: occurred_on, required: true}
      status: {name: 状态, property: status, required: false, default: ready}
      details: {name: 开票信息, property: details, required: false}
    effects:
      - create_object:
          ref: invoice_basis
          type: invoice_basis_data
          name: $input.reference_no
          properties:
            reference_no: $input.reference_no
            amount: $input.amount
            occurred_on: $input.occurred_on
            status: $input.status
            details: $input.details
      - create_relation:
          type: derives
          from: $context
          to: $invoice_basis
          properties: {role: invoice_basis, amount: $input.amount}

  open_user_account:
    name: 开立用户资金账户
    description: 为当前客户开立不依赖具体 ETC 卡的用户资金账户。
    icon: wallet_cards
    handler: changeset
    available_on: [user]
    confirmation: 开立用户资金账户并关联当前客户。
    inputs:
      name: {name: 账户名称, type: string, required: true}
      reference_no: {name: 账户编号, property: reference_no, required: true}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 补充信息, property: details, required: false}
    effects:
      - create_object:
          ref: account
          type: user_account
          name: $input.name
          properties:
            reference_no: $input.reference_no
            status: $input.status
            details: $input.details
      - create_relation:
          type: associates
          from: $account
          to: $context
          properties: {role: account_holder, status: active}

  open_card_account:
    name: 开立卡资金账户
    description: 为当前 ETC 卡开立用于充值、圈存和消费扣款的卡资金账户。
    icon: wallet_cards
    handler: changeset
    available_on: [etc_card]
    confirmation: 开立卡资金账户并关联当前 ETC 卡。
    inputs:
      name: {name: 账户名称, type: string, required: true}
      reference_no: {name: 账户编号, property: reference_no, required: true}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 补充信息, property: details, required: false}
    effects:
      - create_object:
          ref: account
          type: card_account
          name: $input.name
          properties:
            reference_no: $input.reference_no
            status: $input.status
            details: $input.details
      - create_relation:
          type: associates
          from: $account
          to: $context
          properties: {role: account_card, status: active}

  register_stock_account:
    name: 登记库存账户
    description: 为当前机构或操作员登记实物库存数量账本。
    icon: warehouse
    handler: changeset
    available_on: [party]
    confirmation: 登记库存账户并关联当前机构或操作员。
    inputs:
      name: {name: 库存账户名称, type: string, required: true}
      category: {name: 库存账户类别, property: category, required: true}
      reference_no: {name: 库存账户编号, property: reference_no, required: true}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 补充信息, property: details, required: false}
    effects:
      - create_object:
          ref: account
          type: stock_account
          name: $input.name
          properties:
            category: $input.category
            reference_no: $input.reference_no
            status: $input.status
            details: $input.details
      - create_relation:
          type: associates
          from: $account
          to: $context
          properties: {role: stock_holder, status: active}

  record_account_transaction:
    name: 登记账户交易
    description: 在当前用户或卡资金账户登记充值、圈存、冲正、退费、退款、补交或缴费。
    icon: badge_dollar_sign
    handler: changeset
    available_on: [user_account, card_account]
    confirmation: 登记账户交易并关联当前账户。
    inputs:
      name: {name: 交易名称, type: string, required: true}
      category: {name: 交易类别, property: category, required: true}
      reference_no: {name: 交易流水号, property: reference_no, required: true}
      amount: {name: 交易金额, property: amount, required: true}
      occurred_on: {name: 交易日期, property: occurred_on, required: true}
      status: {name: 状态, property: status, required: false, default: completed}
      reason: {name: 业务原因, property: reason, required: false}
      details: {name: 交易详情, property: details, required: false}
    effects:
      - create_object:
          ref: transaction
          type: account_transaction
          name: $input.name
          properties:
            category: $input.category
            reference_no: $input.reference_no
            amount: $input.amount
            occurred_on: $input.occurred_on
            status: $input.status
            reason: $input.reason
            details: $input.details
      - create_relation:
          type: associates
          from: $transaction
          to: $context
          properties: {role: affected_account, status: confirmed}

  record_stock_movement:
    name: 登记库存变化
    description: 在当前库存账户登记 ETC 卡、OBU、CPC 卡或纸券的入库、领用、上缴或调整。
    icon: package_open
    handler: changeset
    available_on: [stock_account]
    confirmation: 登记实物库存变化并关联库存账户和具体物品。
    inputs:
      reference_no: {name: 库存流水号, property: reference_no, required: true}
      category: {name: 变化类别, property: category, required: true}
      item_id: {name: 库存物品, object_types: [obu, etc_card, cpc_card, paper_ticket], required: true}
      quantity: {name: 变化数量, property: quantity, required: true}
      occurred_on: {name: 发生日期, property: occurred_on, required: true}
      reason: {name: 业务原因, property: reason, required: false}
      details: {name: 变化详情, property: details, required: false}
    effects:
      - create_object:
          ref: movement
          type: stock_movement
          name: $input.reference_no
          properties:
            category: $input.category
            reference_no: $input.reference_no
            quantity: $input.quantity
            occurred_on: $input.occurred_on
            reason: $input.reason
            details: $input.details
      - create_relation:
          type: associates
          from: $movement
          to: $context
          properties: {role: affected_stock, status: confirmed}
      - create_relation:
          type: references
          from: $movement
          to: $input.item_id
          properties: {role: stock_item}

  record_consumption:
    name: 登记 ETC 消费
    description: 根据当前 ETC 通行登记消费明细，并关联实际 ETC 卡和卡资金账户。
    icon: circle_dollar_sign
    handler: changeset
    available_on: [passage]
    confirmation: 登记 ETC 消费并建立通行、ETC 卡和卡资金账户追溯关系。
    inputs:
      reference_no: {name: 消费流水号, property: reference_no, required: true}
      card_id: {name: ETC 卡, object_types: [etc_card], required: true}
      account_id: {name: 卡资金账户, object_types: [card_account], required: true}
      amount: {name: 实收金额, property: amount, required: true}
      occurred_on: {name: 消费日期, property: occurred_on, required: true}
      status: {name: 状态, property: status, required: false, default: booked}
      details: {name: 应收与优惠明细, property: details, required: false}
    effects:
      - create_object:
          ref: consumption
          type: consumption_detail
          name: $input.reference_no
          properties:
            reference_no: $input.reference_no
            amount: $input.amount
            occurred_on: $input.occurred_on
            status: $input.status
            details: $input.details
      - create_relation:
          type: references
          from: $consumption
          to: $context
          properties: {role: passage, amount: $input.amount}
      - create_relation:
          type: references
          from: $consumption
          to: $input.card_id
          properties: {role: payment_card}
      - create_relation:
          type: associates
          from: $consumption
          to: $input.account_id
          properties: {role: charged_account, status: confirmed}

  create_bill:
    name: 生成账单
    description: 为当前客户建立一个账单汇总对象，消费明细可随后纳入该账单。
    icon: file_text
    handler: changeset
    available_on: [user]
    confirmation: 生成账单并关联当前客户。
    inputs:
      reference_no: {name: 账单编号, property: reference_no, required: true}
      amount: {name: 账单金额, property: amount, required: true}
      period: {name: 账单期间, property: period, required: true}
      status: {name: 状态, property: status, required: false, default: pending}
      details: {name: 账单详情, property: details, required: false}
    effects:
      - create_object:
          ref: bill
          type: bill
          name: $input.reference_no
          properties:
            reference_no: $input.reference_no
            amount: $input.amount
            period: $input.period
            status: $input.status
            details: $input.details
      - create_relation:
          type: associates
          from: $bill
          to: $context
          properties: {role: billed_user, status: active}

  include_consumption_in_bill:
    name: 纳入消费明细
    description: 将一笔 ETC 消费作为当前账单的汇总来源。
    icon: list_end
    handler: changeset
    available_on: [bill]
    confirmation: 将所选消费明细纳入当前账单。
    inputs:
      consumption_id: {name: 消费明细, object_types: [consumption_detail], required: true}
      amount: {name: 纳入金额, property: amount, required: false}
    effects:
      - create_relation:
          type: derives
          from: $input.consumption_id
          to: $context
          properties: {role: bill_source, amount: $input.amount}

  settle_bill:
    name: 结算账单
    description: 根据当前账单登记缴费、银行扣款或单位结算结果。
    icon: badge_check
    handler: changeset
    available_on: [bill]
    confirmation: 登记账单结算结果并追溯到当前账单。
    inputs:
      reference_no: {name: 结算流水号, property: reference_no, required: true}
      amount: {name: 结算金额, property: amount, required: true}
      occurred_on: {name: 结算日期, property: occurred_on, required: true}
      result: {name: 结算结果, property: result, required: true}
      details: {name: 结算详情, property: details, required: false}
    effects:
      - create_object:
          ref: settlement
          type: bill_settlement
          name: $input.reference_no
          properties:
            reference_no: $input.reference_no
            amount: $input.amount
            occurred_on: $input.occurred_on
            result: $input.result
            details: $input.details
      - create_relation:
          type: derives
          from: $context
          to: $settlement
          properties: {role: bill_settlement, amount: $input.amount}

  record_reconciliation:
    name: 登记对账结果
    description: 对当前资金交易、消费或账单结算登记一致性结论。
    icon: list_checks
    handler: changeset
    available_on: [account_transaction, consumption_detail, bill_settlement]
    confirmation: 登记对账结果并追溯到当前业务事实。
    inputs:
      reference_no: {name: 对账流水号, property: reference_no, required: true}
      occurred_on: {name: 对账日期, property: occurred_on, required: true}
      result: {name: 对账结论, property: result, required: true}
      details: {name: 差异明细, property: details, required: false}
    effects:
      - create_object:
          ref: reconciliation
          type: reconciliation_result
          name: $input.reference_no
          properties:
            reference_no: $input.reference_no
            occurred_on: $input.occurred_on
            result: $input.result
            details: $input.details
      - create_relation:
          type: derives
          from: $context
          to: $reconciliation
          properties: {role: reconciliation_source}

  publish_fee_module:
    name: 发布计费模块
    description: 登记一版同时发布和生效的计费参数包。
    icon: package_check
    handler: changeset
    confirmation: 登记新的计费模块版本。
    inputs:
      name: {name: 模块名称, type: string, required: true}
      version: {name: 模块版本, property: version, required: true}
      valid_from: {name: 生效日期, property: valid_from, required: true}
      status: {name: 状态, property: status, required: false, default: published}
      details: {name: 模块信息, property: details, required: false}
    effects:
      - create_object:
          ref: module
          type: fee_module
          name: $input.name
          properties:
            version: $input.version
            valid_from: $input.valid_from
            status: $input.status
            details: $input.details

  add_fee_rule:
    name: 添加计费规则
    description: 在当前计费模块中添加费率、优惠、路径、代收或省界规则。
    icon: file_cog
    handler: changeset
    available_on: [fee_module]
    confirmation: 添加计费规则并纳入当前模块。
    inputs:
      name: {name: 规则名称, type: string, required: true}
      category: {name: 规则类别, property: category, required: true}
      code: {name: 规则编码, property: code, required: false}
      version: {name: 规则版本, property: version, required: false}
      valid_from: {name: 生效日期, property: valid_from, required: false}
      valid_to: {name: 失效日期, property: valid_to, required: false}
      details: {name: 规则内容, property: details, required: true}
    effects:
      - create_object:
          ref: rule
          type: fee_rule
          name: $input.name
          properties:
            category: $input.category
            code: $input.code
            version: $input.version
            valid_from: $input.valid_from
            valid_to: $input.valid_to
            details: $input.details
      - create_relation:
          type: contains
          from: $context
          to: $rule
          properties: {role: fee_rule}

  add_control_record:
    name: 纳入业务控制
    description: 将当前车辆、OBU、ETC 卡、CPC 卡或业务设备纳入状态、追缴、预约或白名单控制。
    icon: shield_check
    handler: changeset
    available_on: [vehicle, obu, etc_card, cpc_card, business_device]
    confirmation: 登记业务控制记录并关联当前受控对象。
    inputs:
      name: {name: 控制记录名称, type: string, required: true}
      category: {name: 控制类别, property: category, required: true}
      code: {name: 控制记录编码, property: code, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      version: {name: 版本, property: version, required: false}
      valid_from: {name: 生效日期, property: valid_from, required: false}
      valid_to: {name: 失效日期, property: valid_to, required: false}
      reason: {name: 业务原因, property: reason, required: false}
      details: {name: 控制详情, property: details, required: false}
    effects:
      - create_object:
          ref: control
          type: control_record
          name: $input.name
          properties:
            category: $input.category
            code: $input.code
            status: $input.status
            version: $input.version
            valid_from: $input.valid_from
            valid_to: $input.valid_to
            reason: $input.reason
            details: $input.details
      - create_relation:
          type: references
          from: $control
          to: $context
          properties: {role: controlled_object}

  register_operating_parameter:
    name: 登记运行参数
    description: 登记收费站、车道、门架或联网中心使用的版本化运行配置。
    icon: settings_2
    handler: changeset
    confirmation: 登记新的运行参数。
    inputs:
      name: {name: 参数名称, type: string, required: true}
      category: {name: 参数类别, property: category, required: true}
      code: {name: 参数编码, property: code, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      version: {name: 版本, property: version, required: false}
      valid_from: {name: 生效日期, property: valid_from, required: false}
      valid_to: {name: 失效日期, property: valid_to, required: false}
      details: {name: 参数内容, property: details, required: true}
    effects:
      - create_object:
          ref: parameter
          type: operating_parameter
          name: $input.name
          properties:
            category: $input.category
            code: $input.code
            status: $input.status
            version: $input.version
            valid_from: $input.valid_from
            valid_to: $input.valid_to
            details: $input.details
