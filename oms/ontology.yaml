schema: oms.ontology.v1
metamodel: ./metamodel.yaml

ontology:
  name: Enterprise Revenue and Expenditure Ontology
  version: 1.0.0
  reference: ../docs/TwinCore企业运营管理平台全域对象关系图_v1.md
  description: >-
    面向 LLM 的企业经营 MVP 语义层。收入事实、支出事实和现金事实可以独立发生；
    成本通过可延后、可拆分的归因关系与收入建立联系，不要求经过项目或统一核算中心。

principles:
  - 收入、应收和收款分别表示价值确认、收款权利和现金流入，不能互相替代。
  - 支出、成本费用、资产、应付和付款分别表示资源取得、价值消耗、未来价值、付款义务和现金流出。
  - 收入事实与支出事实先独立记录，合同、项目、商机、部门和人员只提供来源及归因线索。
  - 成本与收入是多对多关系，归因可以晚于成本发生，并可按金额拆分、调整和确认。
  - 未归因成本既可能是等待未来收入的前置投入，也可能最终由企业作为期间消耗承担。
  - 企业整体利润统计全部收入和成本；单项收入贡献只扣除已归因到该收入的成本。

concepts:
  enterprise:
    name: 企业
    description: 拥有收入、支出、资产、债权债务和现金事实的经营主体。
    properties: {status: string}

  counterparty:
    name: 交易方
    description: 与企业发生收入、支出或资金往来的组织或个人，其客户、供应商、员工等身份由实际关系体现。
    properties: {party_type: string, status: string}

  revenue:
    name: 收入
    description: 企业在特定期间确认的经济利益流入，不等于合同额、开票额、应收额或收款额。
    properties: {amount: money, period: period, revenue_type: string, status: string}

  expenditure:
    name: 支出事项
    description: 企业为取得或使用资源发生的经济事项；它可以形成成本费用或资产，与是否已经付款相互独立。
    properties: {amount: money, occurred_on: date, expenditure_type: string, status: string}

  cost_expense:
    name: 成本费用
    description: 企业已经消耗并计入特定期间的经济价值；可归因到收入、由企业承担，或暂时等待归因。
    properties: {amount: money, period: period, cost_type: string, status: string}

  asset:
    name: 资产
    description: 支出后仍由企业控制并预期带来未来经济利益的价值，只有后续耗用部分才转为成本费用。
    properties: {amount: money, asset_type: string, status: string}

  receivable:
    name: 应收
    description: 企业已经取得、等待交易方偿付的收款权利。
    properties: {amount: money, due_date: date, status: string}

  payable:
    name: 应付
    description: 企业已经形成、等待向交易方偿付的付款义务。
    properties: {amount: money, due_date: date, status: string}

  cash_receipt:
    name: 收款
    description: 现金或银行资金实际流入企业的事实，通过核销关系说明清偿了哪些应收。
    properties: {amount: money, occurred_on: date, status: string}

  cash_payment:
    name: 付款
    description: 现金或银行资金实际流出企业的事实，通过核销关系说明清偿了哪些应付。
    properties: {amount: money, occurred_on: date, status: string}

relations:
  enterprise_owns_fact:
    from: enterprise
    predicate: 拥有
    to: [revenue, expenditure, cost_expense, asset, receivable, payable, cash_receipt, cash_payment]
    description: 明确经济事实归属的企业；它不是项目或核算中心。
    cardinality: one_to_many

  fact_involves_counterparty:
    from: [revenue, expenditure, receivable, payable, cash_receipt, cash_payment]
    predicate: 涉及
    to: counterparty
    description: 记录经济事实涉及的客户、供应商、员工或其他交易方。
    properties: {role: string}

  revenue_creates_receivable:
    from: revenue
    predicate: 形成
    to: receivable
    description: 收入取得无条件收款权时形成应收；收入与应收可以不在同一时间发生。
    properties: {linked_amount: money}

  cash_receipt_settles_receivable:
    from: cash_receipt
    predicate: 核销
    to: receivable
    description: 收款按金额清偿应收，支持一笔收款对应多笔应收或一笔应收分多次收款。
    properties: {settled_amount: money, settled_on: date}

  expenditure_recognized_as_cost:
    from: expenditure
    predicate: 确认为
    to: cost_expense
    description: 支出取得的价值被消耗后形成成本费用，一笔支出可以分期间或分类确认。
    properties: {recognized_amount: money}

  expenditure_capitalized_as_asset:
    from: expenditure
    predicate: 形成
    to: asset
    description: 支出取得的未来经济利益形成资产，不直接进入当期成本。
    properties: {capitalized_amount: money}

  asset_consumption_creates_cost:
    from: asset
    predicate: 耗用形成
    to: cost_expense
    description: 资产折旧、摊销或其他耗用在特定期间转为成本费用。
    properties: {consumed_amount: money}

  expenditure_creates_payable:
    from: expenditure
    predicate: 形成
    to: payable
    description: 支出达到偿付条件后形成应付，支出金额和应付金额不要求完全相等。
    properties: {linked_amount: money}

  cash_payment_settles_payable:
    from: cash_payment
    predicate: 核销
    to: payable
    description: 付款按金额清偿应付，支持一笔付款对应多笔应付或一笔应付分多次付款。
    properties: {settled_amount: money, settled_on: date}

  cost_attributed_to_revenue:
    from: cost_expense
    predicate: 归因于
    to: revenue
    description: 记录某项收入应承担的成本金额；关系可在收入出现后补建，也可拆分和调整。
    properties: {allocated_amount: money, basis: string, status: string, period: period}

  cost_absorbed_by_enterprise:
    from: cost_expense
    predicate: 由其承担
    to: enterprise
    description: 记录不再归因到具体收入、由企业整体承担的成本费用金额。
    properties: {absorbed_amount: money, reason: string, period: period}

functions:
  analyze_revenue_contribution:
    description: 汇总某项收入、对应应收和收款，以及已归因成本和收入贡献。
    inputs: {revenue_id: string}
    returns: {type: json, description: 收入额、归因成本、贡献额、应收和实收情况}
    reads: [revenue, revenue_creates_receivable, cash_receipt_settles_receivable, cost_attributed_to_revenue]
    instructions: 收入贡献等于收入减已确认归因的成本；待归因成本和企业承担成本不擅自分配到该收入。

  analyze_expenditure:
    description: 解释一笔支出形成了多少成本、资产、应付和付款，以及相关成本最终归因到哪里。
    inputs: {expenditure_id: string}
    returns: {type: json, description: 支出经济去向、结算情况和成本归因结果}
    reads: [expenditure_recognized_as_cost, expenditure_capitalized_as_asset, expenditure_creates_payable, cash_payment_settles_payable, cost_attributed_to_revenue, cost_absorbed_by_enterprise]
    instructions: 支出、成本、资产、应付和付款分别汇总，不能用付款金额代替成本金额。

  analyze_enterprise_result:
    description: 计算企业指定期间的全部收入、成本费用和经营结果，并区分成本归因状态。
    inputs: {enterprise_id: string, period: period}
    returns: {type: json, description: 企业收入、全部成本、经营结果及成本归因结构}
    reads: [enterprise_owns_fact, cost_attributed_to_revenue, cost_absorbed_by_enterprise]
    instructions: 企业经营结果等于全部收入减全部成本费用；成本是否已归因不影响企业成本总额，只影响收入贡献解释。

  find_unattributed_costs:
    description: 找出尚未归因到收入、也未明确由企业承担的成本余额。
    inputs: {enterprise_id: string, period: period}
    returns: {type: json, description: 待归因成本及其来源线索}
    reads: [enterprise_owns_fact, cost_attributed_to_revenue, cost_absorbed_by_enterprise]
    instructions: 待归因金额等于成本金额减已确认归因金额和企业承担金额；不得仅凭项目或时间相近自动确认归因。
