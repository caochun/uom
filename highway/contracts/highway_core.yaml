schema: uom.contract.v1
name: Highway 跨域共享核心契约
version: 1.0.0
description: >-
  由 Highway 各业务域共同使用的对象、关系和属性语义契约。契约不声明存储位置；具体领域负责
  将导入的共享语义绑定到自己的 Repository，并可以在本域收窄对象属性用途和关系端点。
properties:
  category: {name: 类别, type: string, description: 对象或业务事实的类别。}
  code: {name: 编码, type: string, description: 稳定业务编码。}
  reference_no: {name: 来源流水号, type: string, description: 外部或业务事实流水号。}
  status: {name: 状态, type: string, description: 对象或业务事实当前状态。}
  details: {name: 补充信息, type: json, description: 尚未稳定为公共语义的来源信息。}
  plate_no: {name: 车牌号, type: string, description: 车辆或车辆识别事实的车牌标识。}
  vehicle_type: {name: 车型, type: string, description: 车辆或计费事实的车型。}
  medium_kind: {name: 介质类型, type: string, description: OBU、ETC 卡、CPC 卡或纸券。}
  account_kind: {name: 账户类型, type: string, description: 用户、卡或扣款账户类型。}
  balance: {name: 余额, type: money, description: 账户当前余额。}
  valid_from: {name: 生效时间, type: date, description: 业务对象或规则开始有效的日期。}
  valid_to: {name: 失效时间, type: date, description: 业务对象或规则结束有效的日期。}
  longitude: {name: 经度, type: number, description: 空间对象经度。}
  latitude: {name: 纬度, type: number, description: 空间对象纬度。}
  coordinate_system: {name: 坐标系, type: string, description: 经纬度使用的坐标系。}
  mileage: {name: 里程, type: number, description: 道路、收费单元或路径里程。}
  direction: {name: 方向, type: string, description: 行驶或设施方向。}
  mode: {name: 通行方式, type: string, description: ETC 或 MTC 等收费方式。}
  stage: {name: 通行阶段, type: string, description: 入口、门架、出口或牌识阶段。}
  occurred_at: {name: 发生时间, type: datetime, description: 业务事实实际发生的时间。}
  result: {name: 处理结果, type: string, description: 识别、计费、支付或结算结果。}
  charged_vehicle_type: {name: 计费车型, type: string, description: 计费采用的车型。}
  axle_count: {name: 计费轴数, type: number, description: 计费采用的车辆轴数。}
  transaction_type: {name: 交易类型, type: string, description: 正常或其他交易类型。}
  operation_channel: {name: 作业渠道, type: string, description: 完成现场操作的渠道。}
  receivable_amount: {name: 应收金额, type: money, description: 按计费规则计算的应收通行费。}
  discount_amount: {name: 优惠金额, type: money, description: 对应收通行费的减免金额。}
  paid_amount: {name: 实收金额, type: money, description: 实际收取或记账的金额。}
  payment_type: {name: 支付类型, type: string, description: ETC、储值、现金或其他支付方式。}
  fee_type: {name: 计费类型, type: string, description: 采用的计费业务口径。}
  multi_province: {name: 是否跨省, type: boolean, description: 通行是否涉及多个省份。}
  amount: {name: 金额, type: money, description: 业务结果或支付事实金额。}
  period: {name: 业务期间, type: period, description: 汇总结果所属期间。}
  version: {name: 版本, type: string, description: 费率或结算规则版本。}
  reason: {name: 原因, type: string, description: 异常、调整或人工处理原因。}
  role: {name: 关系角色, type: string, description: 关系端点在业务联系中的角色。}
  relation_status: {name: 关系状态, type: string, description: 关系当前是否有效或已确认。}
  source_system: {name: 来源系统, type: string, description: 产生或同步事实的外部系统。}
  source_type: {name: 来源记录类型, type: string, description: 外部系统中的记录类别。}
  source_id: {name: 来源记录标识, type: string, description: 外部系统中的稳定记录标识。}
  event_kind: {name: 事实类别, type: string, description: 交易事实或车辆识别事实。}
  unit_rate: {name: 单位费率, type: number, description: 费率规则的基础单价。}
  discount_rule: {name: 优惠规则, type: json, description: 优惠、折扣或减免条件。}
  split_basis: {name: 拆分依据, type: string, description: 收费单元、路段或业主分配口径。}
  local_amount: {name: 本地金额, type: money, description: 归属于本地经营方的金额。}
  external_amount: {name: 外部金额, type: money, description: 归属于外部经营方的金额。}
  due_amount: {name: 应结金额, type: money, description: 根据拆分结果确认的应结金额。}
  allocated_amount: {name: 已划拨金额, type: money, description: 实际划拨或入账的金额。}
  entry_kind: {name: 记账类型, type: string, description: 充值、扣款、退款或冲正。}
  balance_after: {name: 记账后余额, type: money, description: 本次账户记账完成后的余额。}
objects:
  vehicle:
    name: 车辆
    description: 高速公路通行和收费识别的车辆对象。
    properties:
      plate_no: required
      vehicle_type: optional
      status: optional
      details: optional
  toll_medium:
    name: 通行介质
    description: OBU、ETC 卡、CPC 卡或纸券等身份识别和交易介质。
    properties:
      medium_kind: required
      code: required
      status: optional
      valid_from: optional
      valid_to: optional
      details: optional
  party:
    name: 业务主体
    description: 参与高速收费运营、账户、支付或结算的组织、人员或客户。
    properties:
      category: optional
      code: optional
      status: optional
      details: optional
  passage:
    name: 通行过程
    description: 一辆车在收费路网中的一次完整通行过程。
    properties:
      reference_no: required
      mode: required
      status: optional
      source_system: optional
      source_type: optional
      source_id: optional
      details: optional
  charge:
    name: 计费结果
    description: 根据通行事实和计费依据形成的应收与实收结果。
    properties:
      reference_no: required
      paid_amount: required
      occurred_at: required
      result: required
      receivable_amount: optional
      discount_amount: optional
      version: optional
      source_system: optional
      source_type: optional
      source_id: optional
      details: optional
  payment:
    name: 支付事实
    description: 针对计费结果实际发生的扣款、支付或记账事实。
    properties:
      reference_no: required
      amount: required
      payment_type: required
      occurred_at: required
      result: required
      source_system: optional
      source_type: optional
      source_id: optional
      details: optional
  toll_interval:
    name: 收费单元
    description: 可用于分段计费和费用拆分的道路最小业务单元。
    properties:
      code: required
      direction: optional
      mileage: optional
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  account:
    name: 客户账户
    description: 客户账户域维护的通行扣款或资金记账账户。
    properties:
      account_kind: required
      code: required
      balance: optional
      status: optional
      details: optional
  toll_station:
    name: 收费站
    description: 设施运营域维护的车辆进出收费公路节点。
    properties:
      code: required
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  toll_gantry:
    name: 收费门架
    description: 设施运营域维护的沿线分段计费和识别节点。
    properties:
      code: required
      direction: optional
      mileage: optional
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  toll_lane:
    name: 收费车道
    description: 设施运营域维护的入口或出口作业车道。
    properties:
      code: required
      category: required
      direction: optional
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  equipment:
    name: 业务设备
    description: 设施运营域维护、可被其他业务域引用的收费站、车道或门架设备。
    properties:
      category: required
      code: required
      status: optional
      details: optional
  rate_version:
    name: 费率版本
    description: 费率控制域发布的一组版本化计费规则。
    properties:
      version: required
      valid_from: required
      valid_to: optional
      status: optional
      source_system: optional
      source_type: optional
      source_id: optional
      details: required
  rate_rule:
    name: 费率规则
    description: 费率控制域维护的车型、单价和优惠规则。
    properties:
      code: required
      vehicle_type: required
      unit_rate: required
      fee_type: required
      discount_rule: optional
      valid_from: required
      valid_to: optional
      status: optional
      source_system: optional
      source_type: optional
      source_id: optional
      details: optional
relations:
  contains:
    name: 包含
    description: 一个业务对象或设施由另一个对象组成或承载。
    from: []
    to: []
    properties:
      role: optional
      relation_status: optional
  associates:
    name: 关联
    description: 两个可独立存在的业务对象之间形成联系。
    from: []
    to: []
    properties:
      role: required
      relation_status: optional
  references:
    name: 引用
    description: 一个业务事实引用另一个对象作为来源、依据、参与方或结果。
    from: []
    to: []
    properties:
      role: required
      amount: optional
      relation_status: optional
  derives:
    name: 派生
    description: 一个业务事实经过计算、处理或汇总形成另一个结果。
    from: []
    to: []
    properties:
      role: optional
      amount: optional
      reason: optional
      relation_status: optional
    acyclic: true
