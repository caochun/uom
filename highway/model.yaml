schema: uom.domain.v1
name: OMS 高速联网收费领域模型
version: 3.4.0
description: 面向高速联网收费业务追溯的精简对象关系模型。模型保留路网、车辆与通行介质、 通行交易、拆分清分、客服资金、费率和运行控制的核心语义。来源数据中的业务对象标识 通过关系表达，可沿关系推导的对象联系不重复保存，模型不复刻业务系统表结构。
repositories:
  graph:
    type: sqlite_graph
    mode: writable
    config:
      database: data/graph.db
default_repository: graph
properties:
  category:
    name: 类别
    type: string
    description: 同一对象类型下的业务分类，例如主体角色、设备种类或资金交易种类。
  code:
    name: 编码
    type: string
    description: 来源系统或行业规范中的稳定业务编码。
  status:
    name: 状态
    type: string
    description: 对象或关系当前所处的业务状态。
  details:
    name: 补充信息
    type: json
    description: 尚未稳定为公共属性的结构化业务事实。
  reference_no:
    name: 业务流水号
    type: string
    description: 通行、交易、拆分、账单或清分结果的来源流水号。
  plate_no:
    name: 车牌号
    type: string
    description: 车辆或牌识事实使用的车牌标识，展示时应按权限脱敏。
  vehicle_type:
    name: 车型
    type: string
    description: 车辆档案或识别事实中的车辆类型。
  valid_from:
    name: 生效日期
    type: date
    description: 规则、名单、介质或设施开始有效的日期。
  valid_to:
    name: 失效日期
    type: date
    description: 规则、名单、介质或设施结束有效的日期。
  longitude:
    name: 经度
    type: number
    description: 空间对象在所声明坐标系中的经度，取值范围为 -180 至 180。
  latitude:
    name: 纬度
    type: number
    description: 空间对象在所声明坐标系中的纬度，取值范围为 -90 至 90。
  coordinate_system:
    name: 坐标系
    type: string
    description: 经纬度采用的坐标系；高德地图坐标使用 GCJ-02。
  mileage:
    name: 里程
    type: number
    description: 路段、收费单元或路径的里程。
  direction:
    name: 方向
    type: string
    description: 上行、下行、入口或出口等业务方向。
  channel:
    name: 办理渠道
    type: string
    description: 网点、终端、线上或其他业务办理渠道。
  mode:
    name: 通行方式
    type: string
    description: ETC 或 MTC 通行收费方式；实际使用的 OBU、CPC 卡或纸券由关系表达。
  stage:
    name: 通行阶段
    type: string
    description: 入口、门架或出口等通行交易和牌识阶段。
  occurred_at:
    name: 发生时间
    type: datetime
    description: 交易、识别等时序事实实际发生的 ISO 日期时间。
  transaction_type:
    name: 交易类型
    type: string
    description: 正常、车队、闯关或其他交易业务类型。
  charged_vehicle_type:
    name: 计费车型
    type: string
    description: 某笔通行交易实际采用的联网收费车型，不由车辆档案值替代。
  axle_count:
    name: 计费轴数
    type: number
    description: 某笔通行交易实际采用的车辆轴数。
  result:
    name: 处理结果
    type: string
    description: 查验、计费、结算或对账形成的业务结论。
  operation_channel:
    name: 作业渠道
    type: string
    description: 车道终端、手持终端或其他完成交易的现场作业渠道。
  receivable_amount:
    name: 应收金额
    type: money
    description: 按计费规则计算的应收通行费。
  discount_amount:
    name: 优惠金额
    type: money
    description: 本次交易相对应收金额减免的金额。
  paid_amount:
    name: 实收金额
    type: money
    description: 本次交易实际收取或记账的金额。
  payment_type:
    name: 支付类型
    type: string
    description: ETC 记账、储值、现金、移动支付或其他支付方式。
  fee_type:
    name: 计费类型
    type: string
    description: 本次出口交易采用的计费业务口径。
  multi_province:
    name: 跨省交易
    type: boolean
    description: 本次通行交易是否涉及多个省份。
  occurred_on:
    name: 发生日期
    type: date
    description: 业务事实实际发生的日期。
  original_amount:
    name: 原金额
    type: money
    description: 调整、退补或二次计费前的原始金额。
  amount:
    name: 金额
    type: money
    description: 由数值和 ISO 币种组成的金额。
  version:
    name: 版本
    type: string
    description: 费率、名单或运行参数的业务版本。
  period:
    name: 业务期间
    type: period
    description: 汇总事实所属月份，格式为 YYYY-MM。
  balance:
    name: 余额
    type: money
    description: 资金账户或记账完成后的业务余额。
  reason:
    name: 原因
    type: string
    description: 调整、冲正、名单纳入或异常处理的业务原因。
  quantity:
    name: 数量
    type: number
    description: 库存或业务汇总中的数量。
  role:
    name: 关系角色
    type: string
    description: 关系端点在当前业务联系中承担的角色。
objects:
  party:
    name: 业务主体
    description: 参与联网收费运营的组织或人员；通过 category 区分收费公路业主、发行服务机构、 省联网中心、部联网中心、客服合作机构或操作员。ETC 开户客户单独使用 user
      表达。
    properties:
      category: optional
      code: optional
      status: optional
      details: optional
  user:
    name: 客户
    description: ETC 发行服务中的开户客户，是户、车、卡、签关系的客户侧起点。
    properties:
      reference_no: required
      status: optional
      details: optional
  vehicle:
    name: 车辆
    description: 高速公路通行和收费识别的核心业务主体。
    properties:
      plate_no: required
      vehicle_type: required
      status: optional
      details: optional
  obu:
    name: OBU 电子标签
    description: 安装在车辆上的 ETC 识别与交易认证设备，与车辆形成长期绑定关系。
    properties:
      category: optional
      code: required
      status: optional
      valid_from: optional
      valid_to: optional
      details: optional
  etc_card:
    name: ETC 卡
    description: ETC 用户身份和支付凭证，与车辆及卡资金账户形成长期业务关系。
    properties:
      category: optional
      code: required
      status: optional
      valid_from: optional
      valid_to: optional
      details: optional
  cpc_card:
    name: CPC 卡
    description: MTC 车辆入口领取、出口交回的可重复使用通行介质，只与一次通行临时关联。
    properties:
      code: required
      status: optional
      valid_from: optional
      valid_to: optional
      details: optional
  paper_ticket:
    name: 纸券
    description: 入口临时发放、出口凭券计费溯源的纸质通行凭证，只与一次通行临时关联。
    properties:
      code: required
      status: optional
      valid_from: optional
      valid_to: optional
      details: optional
  toll_road:
    name: 收费公路
    description: 聚合收费路段并承载全路基本信息的顶层道路资源。
    properties:
      code: required
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  section:
    name: 收费路段
    description: 具有统一经营管理主体和收费性质的连续路段区间。
    properties:
      code: required
      mileage: optional
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  toll_interval:
    name: 收费单元
    description: 按方向承载费率、执行分段计费和费用拆分的最小路网单元。
    properties:
      code: required
      direction: optional
      mileage: optional
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  toll_station:
    name: 收费站
    description: 车辆进出收费公路并完成介质处理、交易和查验的服务节点。
    properties:
      code: required
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  toll_plaza:
    name: 收费广场
    description: 收费站内连接道路与收费车道的车辆组织区域。
    properties:
      code: required
      direction: optional
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  toll_lane:
    name: 收费车道
    description: ETC、MTC、混合或自助收费交易的最终执行点。
    properties:
      code: required
      category: required
      direction: optional
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  toll_gantry:
    name: 收费门架
    description: 沿线执行分段计费、介质读写和车辆识别的门架系统。
    properties:
      code: required
      direction: optional
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  service_facility:
    name: 服务设施或渠道
    description: 发行服务和拓展支付的设施；通过 category 区分服务区、停车场、加油站、 站前预交易设施、营业网点、流动服务点、自助终端和线上渠道。
    properties:
      category: required
      code: optional
      channel: optional
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  business_device:
    name: 业务设备
    description: 部署于中心、收费站、车道或门架的设备；设备类别、技术参数和运行信息保存在 category 与 details 中，不为每种硬件建立独立对象类型。
    properties:
      category: required
      code: required
      longitude: optional
      latitude: optional
      coordinate_system: optional
      status: optional
      details: optional
  passage:
    name: 通行记录
    description: 一次车辆通行过程的追溯起点，关联车辆、实际使用的介质以及入口、门架和出口事实； 通行时间、位置、车型和金额从所关联的事实中取得，不在此重复保存。
    properties:
      reference_no: required
      mode: required
      status: optional
      details: optional
  toll_transaction:
    name: 通行交易记录
    description: 入口、门架或出口产生的交易事实。交易通过关系归属于一次通行并指向实际车道或门架； 车辆、介质、收费站等可由该关系链推导，不作为交易属性或重复关系保存。
    properties:
      reference_no: required
      stage: required
      occurred_at: required
      transaction_type: optional
      charged_vehicle_type: optional
      axle_count: optional
      result: optional
      operation_channel: optional
      receivable_amount: optional
      discount_amount: optional
      paid_amount: optional
      payment_type: optional
      fee_type: optional
      multi_province: optional
      status: optional
      details: optional
  vehicle_id_record:
    name: 车辆识别记录
    description: 某笔通行交易在特定时点观察到的车辆识别事实。识别车牌和车型保留原始观察值， 即使它们与通行所关联车辆的档案值不同；识别位置由所属交易关联的车道或门架推导。
    properties:
      reference_no: required
      occurred_at: required
      plate_no: optional
      vehicle_type: optional
      direction: optional
      result: optional
      details: optional
  vehicle_check_result:
    name: 预约车辆查验结果
    description: 绿通、大件运输等预约车辆在出口形成的查验结论。
    properties:
      reference_no: required
      occurred_on: required
      result: required
      details: optional
  second_charge_result:
    name: 二次计费结果
    description: 特殊通行在查验或省级优惠处理后重新计算形成的费额结果。
    properties:
      reference_no: required
      original_amount: optional
      amount: required
      occurred_on: required
      result: required
      details: optional
  split_record:
    name: 省内拆分记录
    description: 按通行路径和收费单元对一次通行费进行拆分计算的结果。
    properties:
      reference_no: required
      amount: required
      occurred_on: required
      status: optional
      details: optional
  split_basis:
    name: 拆分依据
    description: 一项拆分所采用的路径、费率版本和计算规则。
    properties:
      version: optional
      details: required
  split_detail:
    name: 拆分明细
    description: 一项拆分中归属于具体收费单元或业主的金额明细。
    properties:
      amount: required
      details: optional
  clearing_result:
    name: 清分结果
    description: 按收费公路业主汇总、用于结算的清分业务结果。
    properties:
      reference_no: required
      amount: required
      period: required
      occurred_on: required
      status: optional
      details: optional
  invoice_basis_data:
    name: 发票基础数据
    description: 由通行和拆分结果生成、用于开具通行费发票的基础事实。
    properties:
      reference_no: required
      amount: required
      occurred_on: required
      status: optional
      details: optional
  customer_service_record:
    name: 客服业务记录
    description: 客户、车辆、ETC 卡或 OBU 的开户、发行、变更、挂失、激活和注销等办理结果。
    properties:
      category: required
      reference_no: required
      occurred_on: required
      result: required
      channel: optional
      details: optional
  user_account:
    name: 用户资金账户
    description: 客户级资金账户，不依赖具体 ETC 卡，用于充值资金挂账和向卡账户划转。
    properties:
      reference_no: required
      balance: optional
      status: optional
      details: optional
  card_account:
    name: 卡资金账户
    description: ETC 卡对应的资金账户，用于记录充值、圈存、消费扣款、冲正和退款。
    properties:
      reference_no: required
      balance: optional
      status: optional
      details: optional
  account_entry:
    name: 账户记账明细
    description: 用户账户或卡账户的一笔余额变动，是充值、圈存、冲正、消费、退款或缴费等来源事实 实际记入账户后的结果；通过 category 区分记账类型。
    properties:
      category: required
      reference_no: required
      amount: required
      occurred_on: required
      balance: optional
      status: required
      details: optional
  stock_account:
    name: 库存账户
    description: 机构或操作员管理 ETC 卡、OBU、CPC 卡和票据实物库存的数量账本。
    properties:
      category: required
      reference_no: required
      status: optional
      details: optional
  account_transaction:
    name: 账户交易
    description: 引起资金账户余额变化的交易；通过 category 区分充值、圈存、冲正、退费、 退款、补交和账单缴费。
    properties:
      category: required
      reference_no: required
      amount: required
      occurred_on: required
      status: required
      reason: optional
      details: optional
  consumption_detail:
    name: ETC 消费明细
    description: ETC 卡消费形成的逐笔应收、实收、优惠和记账事实。
    properties:
      reference_no: required
      amount: required
      occurred_on: required
      status: required
      details: optional
  bill:
    name: 账单
    description: 对一定期间内消费明细汇总形成的客户应结算结果。
    properties:
      reference_no: required
      amount: required
      period: required
      status: required
      details: optional
  bill_settlement:
    name: 账单结算结果
    description: 账单经缴费、银行扣款或单位结算后形成的结果。
    properties:
      reference_no: required
      amount: required
      occurred_on: required
      result: required
      details: optional
  stock_movement:
    name: 库存变化记录
    description: ETC 卡、OBU、CPC 卡或票据在机构与操作员库存间发生的数量变化事实。
    properties:
      category: required
      reference_no: required
      quantity: required
      occurred_on: required
      reason: optional
      details: optional
  business_day_summary:
    name: 业务日结
    description: 客服机构或操作员一个营业日内的业务和资金汇总结果。
    properties:
      reference_no: required
      occurred_on: required
      result: optional
      details: required
  reconciliation_result:
    name: 对账结果
    description: 业务数据和资金渠道完成核对后形成的一致性结论与差异说明。
    properties:
      reference_no: required
      occurred_on: required
      result: required
      details: optional
  fee_module:
    name: 计费模块
    description: 聚合一组可同时发布和生效的费率、优惠、路径及代收规则。
    properties:
      version: required
      valid_from: required
      status: optional
      details: optional
  fee_rule:
    name: 费率或计费规则
    description: 计费模块内的规则项；通过 category 区分基础费率、省级费率、优惠策略、 代收关系、省界关系和最小费额路径。
    properties:
      category: required
      code: optional
      version: optional
      valid_from: optional
      valid_to: optional
      details: required
  control_record:
    name: 业务控制记录
    description: 针对车辆、OBU、ETC 卡、CPC 卡或业务设备生效的控制事实；通过 category 区分 状态名单、追缴名单、预约、关注名单和白名单。
    properties:
      category: required
      code: optional
      status: required
      version: optional
      valid_from: optional
      valid_to: optional
      reason: optional
      details: optional
  operating_parameter:
    name: 运行参数
    description: 控制收费站、车道、门架或联网中心运行方式的版本化配置，不代表名单成员。
    properties:
      category: required
      code: optional
      status: required
      version: optional
      valid_from: optional
      valid_to: optional
      details: required
relations:
  route_next:
    name: 路网后继
    description: from 和 to 是计费路径上相邻的收费站或收费门架，方向表示车辆行驶方向； 用设施对象自身表达 V3.1 的 RoadNode/NodeRelation，避免重复节点身份。
    from:
    - toll_station
    - toll_gantry
    to:
    - toll_station
    - toll_gantry
    properties:
      direction: optional
      mileage: optional
      status: optional
  contains:
    name: 包含
    description: from 是整体，to 是依附于整体的组成部分；用于路网层级、设施设备、拆分明细和费率包。
    from:
    - party
    - toll_road
    - section
    - toll_station
    - toll_plaza
    - toll_lane
    - toll_gantry
    - service_facility
    - passage
    - user_account
    - card_account
    - split_record
    - fee_module
    to:
    - section
    - toll_interval
    - toll_station
    - toll_plaza
    - toll_lane
    - toll_gantry
    - service_facility
    - business_device
    - account_entry
    - split_basis
    - split_detail
    - second_charge_result
    - fee_rule
    properties:
      role: optional
  references:
    name: 引用
    description: from 业务记录使用 to 独立对象提供的信息；被引用对象不依附于引用者存在。
    from:
    - toll_interval
    - passage
    - toll_transaction
    - vehicle_id_record
    - vehicle_check_result
    - split_detail
    - customer_service_record
    - account_transaction
    - consumption_detail
    - bill_settlement
    - stock_movement
    - reconciliation_result
    - fee_rule
    - control_record
    - operating_parameter
    to: []
    properties:
      role: required
      amount: optional
  associates:
    name: 关联
    description: 两个可独立存在的对象之间形成业务联系，例如户车、车卡签、业主路段和账户归属。
    from: []
    to: []
    properties:
      role: required
      status: optional
  derives:
    name: 派生
    description: from 是来源事实，to 是由其计算、汇总或处理生成的结果；方向统一为“来源到结果”。
    from:
    - toll_interval
