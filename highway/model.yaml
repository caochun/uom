schema: oag.ontology.v1
name: OMS 高速联网收费领域模型
version: 3.4.0
description: 面向高速联网收费业务追溯的精简对象关系模型。模型保留路网、车辆与通行介质、 通行交易、拆分清分、客服资金、费率和运行控制的核心语义。来源数据中的业务对象标识 通过关系表达，可沿关系推导的对象联系不重复保存，模型不复刻业务系统表结构。
tool_preferences:
  generic_search: fallback_only
excluded_tools:
- describe
- mutate
- summarize_progress
- dispatch_workers
data_sources:
  uom_graph:
    type: uom_sqlite_graph
    mode: writable
    capabilities:
    - object_query
    - relation_query
    - adjacency_query
    - versioned_changeset
    - history
    config:
      database: data/graph.db
objects:
  party:
    display_name: 业务主体
    summary: 参与联网收费运营的组织或人员；通过 category 区分收费公路业主、发行服务机构、 省联网中心、部联网中心、客服合作机构或操作员。ETC 开户客户单独使用 user 表达。
    description: 参与联网收费运营的组织或人员；通过 category 区分收费公路业主、发行服务机构、 省联网中心、部联网中心、客服合作机构或操作员。ETC 开户客户单独使用 user
      表达。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: party
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
      category:
        type: string
        required: false
        display_name: 类别
        description: 同一对象类型下的业务分类，例如主体角色、设备种类或资金交易种类。
      code:
        type: string
        required: false
        display_name: 编码
        description: 来源系统或行业规范中的稳定业务编码。
      status:
        type: string
        required: false
        display_name: 状态
        description: 对象或关系当前所处的业务状态。
      details:
        type: json
        required: false
        display_name: 补充信息
        description: 尚未稳定为公共属性的结构化业务事实。
  user:
    display_name: 客户
