            version: $input.version
            valid_from: $input.valid_from
            valid_to: $input.valid_to
            details: $input.details
      - create_relation:
          type: derives
          from: $context
          to: $result_rule
          properties: {role: calculation_source}

  add_control_record:
    name: 纳入业务控制
    description: 将当前车辆、OBU、ETC 卡、CPC 卡或业务设备纳入状态、追缴、预约或白名单控制。
    icon: shield_check
    handler: changeset
    available_on: [vehicle, obu, etc_card, cpc_card, business_device]
    confirmation: 登记业务控制记录并关联当前受控对象。
    inputs:
      name: {name: 控制记录名称, type: string, required: true}
      category: {name: 控制类别, property: category, required: true}
      code: {name: 控制记录编码, property: code, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      version: {name: 版本, property: version, required: false}
      valid_from: {name: 生效日期, property: valid_from, required: false}
      valid_to: {name: 失效日期, property: valid_to, required: false}
      reason: {name: 业务原因, property: reason, required: false}
      details: {name: 控制详情, property: details, required: false}
    effects:
      - create_object:
          ref: control
          type: control_record
          name: $input.name
          properties:
            category: $input.category
            code: $input.code
            status: $input.status
            version: $input.version
            valid_from: $input.valid_from
            valid_to: $input.valid_to
            reason: $input.reason
            details: $input.details
      - create_relation:
          type: references
          from: $control
          to: $context
          properties: {role: controlled_object}

  promote_control_record:
    name: 确认追缴名单
    description: 根据当前预追缴记录生成正式追缴记录，保留稽核确认来源。
    icon: shield_alert
    handler: changeset
    available_on: [control_record]
    confirmation: 生成正式追缴记录并保留预追缴来源。
    inputs:
      name: {name: 追缴记录名称, type: string, required: true}
      code: {name: 追缴记录编码, property: code, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      version: {name: 版本, property: version, required: false}
      valid_from: {name: 生效日期, property: valid_from, required: false}
      valid_to: {name: 失效日期, property: valid_to, required: false}
      reason: {name: 确认原因, property: reason, required: true}
      details: {name: 追缴详情, property: details, required: false}
    effects:
      - create_object:
          ref: recovery
          type: control_record
          name: $input.name
          properties:
            category: recovery
            code: $input.code
            status: $input.status
            version: $input.version
            valid_from: $input.valid_from
            valid_to: $input.valid_to
            reason: $input.reason
            details: $input.details
      - create_relation:
          type: derives
          from: $context
          to: $recovery
          properties: {role: confirmed_recovery, reason: $input.reason}

  register_operating_parameter:
    name: 登记运行参数
    description: 登记收费站、车道、门架或联网中心使用的版本化运行配置。
    icon: settings_2
    handler: changeset
    confirmation: 登记新的运行参数。
    inputs:
      name: {name: 参数名称, type: string, required: true}
      category: {name: 参数类别, property: category, required: true}
      code: {name: 参数编码, property: code, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      version: {name: 版本, property: version, required: false}
      valid_from: {name: 生效日期, property: valid_from, required: false}
      valid_to: {name: 失效日期, property: valid_to, required: false}
      details: {name: 参数内容, property: details, required: true}
    effects:
      - create_object:
          ref: parameter
          type: operating_parameter
          name: $input.name
          properties:
            category: $input.category
            code: $input.code
            status: $input.status
            version: $input.version
            valid_from: $input.valid_from
            valid_to: $input.valid_to
            details: $input.details

  apply_operating_parameter:
    name: 应用运行参数
    description: 将当前运行参数应用到收费站、收费车道、收费门架、车辆或业务设备。
    icon: settings
    handler: changeset
    available_on: [operating_parameter]
    confirmation: 将运行参数关联到所选业务对象。
    inputs:
      target_id:
        name: 应用对象
        object_types: [toll_station, toll_lane, toll_gantry, toll_interval, vehicle, business_device]
        required: true
      role: {name: 参数作用, property: role, required: false, default: configured_object}
    effects:
      - create_relation:
          type: references
          from: $context
          to: $input.target_id
          properties: {role: $input.role}
