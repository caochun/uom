            longitude: $input.longitude
            latitude: $input.latitude
            coordinate_system: $input.coordinate_system
            status: $input.status
            details: $input.details

  register_section:
    name: 登记收费路段
    description: 在当前收费公路下登记收费路段。
    icon: between_horizontal_start
    handler: changeset
    available_on: [toll_road]
    confirmation: 登记收费路段并纳入当前公路。
