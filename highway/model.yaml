      name: {name: 单元名称, type: string, required: true}
      code: {name: 单元编码, property: code, required: true}
      direction: {name: 方向, property: direction, required: false}
      mileage: {name: 里程, property: mileage, required: false}
      longitude: {name: 代表点经度, property: longitude, required: false}
      latitude: {name: 代表点纬度, property: latitude, required: false}
      coordinate_system: {name: 坐标系, property: coordinate_system, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 补充信息, property: details, required: false}
    effects:
      - create_object:
          ref: interval
          type: toll_interval
          name: $input.name
          properties:
