          properties:
            code: $input.code
            status: $input.status
            valid_from: $input.valid_from
            valid_to: $input.valid_to
            details: $input.details

  register_toll_road:
    name: 登记收费公路
    description: 登记路网中的顶层收费公路。
    icon: route
