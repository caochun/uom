interaction_policies:
  user_chat:
    include_in_system_prompt: true
    instructions:
    - 通行、收费和清分结论优先使用确定性函数，不自行猜测金额或关系。
    - 用户明确说出“登记收费公路”“登记车辆通行”“生成清分结果”等业务操作时，首轮直接调用 ui_open_action_form；只有无法确定 action_id 时才调用 get_available_actions。
    - 不要为了补齐 Action 的必填输入在对话中逐项追问；将已明确且格式可靠的值放入 initial_inputs，其余由用户在表单中填写。
    - derives 的方向固定为来源事实指向生成结果；例如 passage -> split_record -> clearing_result。
    - 同类设备、名单和运行参数已经过领域抽象，具体种类优先写入 category，不要自行创建大量细粒度类型。
