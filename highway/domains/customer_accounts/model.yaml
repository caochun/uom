schema: uom.domain.v1
name: Highway 客户账户业务域
version: 1.0.0
description: >-
  面向通行扣款和客户账户记账的业务域。账户记录余额和账户明细，支付、计费和通行作为跨域事实通过关系关联。
imports:
  - path: ../../contracts/highway_core.yaml
    properties: [category, code, reference_no, status, details, plate_no, mode, occurred_at, result, paid_amount, payment_type, amount, role, relation_status, source_system, source_type, source_id]
    objects: [party, passage, charge, payment, vehicle]
    relations: [contains, associates, references]
repositories:
  graph:
    type: sqlite_graph
    mode: writable
    config:
      database: ../../data/graph.db
default_repository: graph
properties:
  code: {name: 编码, type: string, description: 账户或外部系统的稳定编码。}
  category: {name: 类别, type: string, description: 主体或账户类别。}
  status: {name: 状态, type: string, description: 当前业务状态。}
  details: {name: 补充信息, type: json, description: 尚未稳定为公共语义的来源信息。}
  account_kind: {name: 账户类型, type: string, description: ETC 扣款、储值或其他账户类型。}
  balance: {name: 余额, type: money, description: 账户当前余额。}
  reference_no: {name: 流水号, type: string, description: 外部或业务流水号。}
  amount: {name: 金额, type: money, description: 记账或支付金额。}
  entry_kind: {name: 记账类型, type: string, description: 充值、扣款、退款、冲正等账户变动类型。}
  occurred_at: {name: 发生时间, type: datetime, description: 账户事实发生的 ISO 日期时间。}
  result: {name: 处理结果, type: string, description: 记账或支付结果。}
  balance_after: {name: 记账后余额, type: money, description: 本次记账完成后的账户余额。}
  payment_type: {name: 支付类型, type: string, description: ETC 记账、现金或其他支付方式。}
  mode: {name: 通行方式, type: string, description: ETC 或 MTC。}
  plate_no: {name: 车牌号, type: string, description: 车辆车牌标识。}
  paid_amount: {name: 实收金额, type: money, description: 计费结果的实收金额。}
  source_system: {name: 来源系统, type: string, description: 产生该事实的外部系统。}
  source_type: {name: 来源记录类型, type: string, description: 外部系统中的记录类别。}
  source_id: {name: 来源记录标识, type: string, description: 外部系统中的稳定记录标识。}
  role: {name: 关系角色, type: string, description: 关系端点在当前业务联系中的角色。}
  relation_status: {name: 关系状态, type: string, description: 关系当前状态。}
objects:
  account:
    name: 客户账户
    description: 记录客户或通行介质对应的可扣款、充值和记账余额。
    properties:
      account_kind: required
      code: required
      balance: optional
      status: optional
      details: optional
  account_entry:
    name: 账户记账明细
    description: 一次账户余额增加、减少或调整的记账事实。
    properties:
      reference_no: required
      entry_kind: required
      amount: required
      occurred_at: required
      result: required
      balance_after: optional
      source_system: optional
      source_type: optional
      source_id: optional
      details: optional
relations:
  contains:
    name: 包含
    description: 账户包含其账户记账明细。
    from: [account]
    to: [account_entry]
    properties:
      relation_status: optional
  associates:
    name: 关联
    description: 主体、车辆、账户和支付事实之间的业务联系。
    from: [party, account, payment]
    to: [account, vehicle, party]
    properties:
      role: required
      relation_status: optional
  references:
    name: 引用
    description: 账户明细或支付事实引用其对应的计费、通行或账户来源。
    from: [account_entry, payment]
    to: []
    properties:
      role: required
      relation_status: optional
functions:
  get_account_ledger:
    name: 获取客户账户账务链
    description: 返回指定账户的余额线索、账户记账明细，以及明细关联的支付、计费和通行事实。
    usage_prompt: 用户询问某个客户账户的余额变化、充值扣款明细或某笔扣款对应的通行时使用。
    inputs:
      account_id: {type: string, description: 客户账户对象 ID}
      limit: {type: integer, description: 最多返回的账户明细数量, default: 100}
    reads:
      objects: [account, account_entry, payment, charge, passage]
      relations: [contains, references]
actions:
  register_account:
    name: 登记客户账户
    description: 登记一个可用于通行扣款或资金记账的客户账户。
    icon: wallet_cards
    inputs:
      name: {name: 账户名称, type: string, required: true}
      account_kind: {name: 账户类型, property: account_kind, required: true}
      code: {name: 账户编码, property: code, required: true}
      balance: {name: 初始余额, property: balance, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 账户详情, property: details, required: false}
    changes:
      create: {objects: [account], relations: []}
    confirmation: 登记客户账户。
  record_account_entry:
    name: 登记账户记账
    description: 在当前账户下登记一次充值、扣款、退款或冲正明细，并可关联支付或通行事实。
    icon: receipt
    "on": [account]
    inputs:
      reference_no: {name: 记账流水号, property: reference_no, required: true}
      entry_kind: {name: 记账类型, property: entry_kind, required: true}
      amount: {name: 记账金额, property: amount, required: true}
      occurred_at: {name: 记账时间, property: occurred_at, required: true}
      result: {name: 记账结果, property: result, required: true}
      balance_after: {name: 记账后余额, property: balance_after, required: false}
      payment_id: {name: 对应支付, objects: [payment], required: false}
      passage_id: {name: 对应通行, objects: [passage], required: false}
      source_system: {name: 来源系统, property: source_system, required: false}
      source_type: {name: 来源记录类型, property: source_type, required: false}
      source_id: {name: 来源记录标识, property: source_id, required: false}
      details: {name: 记账详情, property: details, required: false}
    changes:
      create: {objects: [account_entry], relations: [contains, references]}
    confirmation: 登记账户记账明细。
agent:
  instructions:
  - 账户余额变化以 account_entry 为事实依据，不要只根据 account.balance 推断历史。
  - 通行扣款应沿 account_entry -> references -> payment -> references -> charge 追溯。
