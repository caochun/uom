schema: uom.domain.v1
name: Highway 通行收费域
version: 5.1.0
description: >-
  面向车辆一次通行形成计费与支付的业务链。本域拥有车辆、通行介质、通行事实以及通行、计费、支付行为；
  设施、客户账户、清分结算和费率控制只作为跨域引用，不在本域重复维护。
imports:
  - path: ../../contracts/highway_core.yaml
    properties: [category, code, reference_no, status, details, plate_no, vehicle_type, medium_kind, valid_from, valid_to, mode, stage, occurred_at, result, charged_vehicle_type, axle_count, transaction_type, operation_channel, receivable_amount, discount_amount, paid_amount, payment_type, fee_type, multi_province, amount, version, reason, role, relation_status, source_system, source_type, source_id, event_kind]
    objects: [party, passage, charge, payment, account, toll_station, toll_gantry, toll_lane, rate_version, rate_rule]
    relations: [contains, associates, references, derives]
repositories:
  graph:
    type: sqlite_graph
    mode: writable
    config: {database: ../../data/graph.db}
default_repository: graph
properties:
  category: {name: 类别, type: string, description: 业务主体或业务事实类别。}
  code: {name: 编码, type: string, description: 稳定业务编码。}
  reference_no: {name: 来源流水号, type: string, description: 外部系统或业务事实流水号。}
  status: {name: 状态, type: string, description: 对象或事实当前状态。}
  details: {name: 补充信息, type: json, description: 尚未稳定为公共语义的来源信息。}
  plate_no: {name: 车牌号, type: string, description: 车辆识别使用的车牌标识。}
  vehicle_type: {name: 车型, type: string, description: 车辆档案中的车型。}
  medium_kind: {name: 介质类型, type: string, description: OBU、ETC 卡、CPC 卡或纸券。}
  valid_from: {name: 生效时间, type: date, description: 对象开始有效的日期。}
  valid_to: {name: 失效时间, type: date, description: 对象结束有效的日期。}
  mode: {name: 通行方式, type: string, description: ETC 或 MTC 等收费方式。}
  stage: {name: 通行阶段, type: string, description: 入口、门架、出口或牌识阶段。}
  occurred_at: {name: 发生时间, type: datetime, description: 业务事实实际发生的时间。}
  result: {name: 处理结果, type: string, description: 识别、计费或支付结果。}
  charged_vehicle_type: {name: 计费车型, type: string, description: 通行事实采用的计费车型。}
  axle_count: {name: 计费轴数, type: number, description: 通行事实采用的车辆轴数。}
  transaction_type: {name: 交易类型, type: string, description: 正常或其他交易类型。}
  operation_channel: {name: 作业渠道, type: string, description: 完成现场操作的渠道。}
  receivable_amount: {name: 应收金额, type: money, description: 按计费规则计算的应收通行费。}
  discount_amount: {name: 优惠金额, type: money, description: 对应收通行费的减免金额。}
  paid_amount: {name: 实收金额, type: money, description: 计费结果确认的实收金额。}
  payment_type: {name: 支付类型, type: string, description: ETC、储值、现金或其他支付方式。}
  fee_type: {name: 计费类型, type: string, description: 采用的计费业务口径。}
  multi_province: {name: 是否跨省, type: boolean, description: 通行是否涉及多个省份。}
  amount: {name: 金额, type: money, description: 支付事实发生的金额。}
  version: {name: 版本, type: string, description: 计费使用的规则版本号。}
  role: {name: 关系角色, type: string, description: 关系端点在业务联系中的角色。}
  relation_status: {name: 关系状态, type: string, description: 关系当前是否有效或已确认。}
  source_system: {name: 来源系统, type: string, description: 产生事实的外部系统。}
  source_type: {name: 来源记录类型, type: string, description: 外部系统中的记录类别。}
  source_id: {name: 来源记录标识, type: string, description: 外部系统中的稳定记录标识。}
  event_kind: {name: 事实类别, type: string, description: 交易事实或车辆识别事实。}
  inspection_kind: {name: 查验类型, type: string, description: 预约、绿通或其他特殊车辆查验类型。}
  adjustment_kind: {name: 调整类型, type: string, description: 二次计费、补收、退费或其他计费调整类型。}
objects:
  party:
    name: 业务主体
    description: 参与车辆、通行或支付主链的客户、发行机构或操作主体。
    properties: {category: optional, code: optional, status: optional, details: optional}
  passage:
    name: 通行过程
    description: 一辆车在收费路网中的一次完整通行过程。
    properties: {reference_no: required, mode: required, status: optional, source_system: optional, source_type: optional, source_id: optional, details: optional}
  charge:
    name: 计费结果
    description: 根据一次通行及其计费依据形成的应收与实收结果。
    properties: {reference_no: required, paid_amount: required, occurred_at: required, result: required, receivable_amount: optional, discount_amount: optional, version: optional, source_system: optional, source_type: optional, source_id: optional, details: optional}
  payment:
    name: 支付事实
    description: 针对计费结果实际发生的扣款、支付或记账事实。
    properties: {reference_no: required, amount: required, payment_type: required, occurred_at: required, result: required, source_system: optional, source_type: optional, source_id: optional, details: optional}
  vehicle:
    name: 车辆
    description: 高速公路通行和收费识别的核心对象。
    properties: {plate_no: required, vehicle_type: optional, status: optional, details: optional}
  toll_medium:
    name: 通行介质
    description: 参与身份识别、入口信息记录或支付处理的 OBU、ETC 卡、CPC 卡或纸券。
    properties: {medium_kind: required, code: required, status: optional, valid_from: optional, valid_to: optional, details: optional}
  passage_event:
    name: 通行事实
    description: 一次通行在入口、门架或出口发生的交易或车辆识别事实。
    properties:
      reference_no: required
      event_kind: required
      stage: required
      occurred_at: required
      result: optional
      charged_vehicle_type: optional
      axle_count: optional
      transaction_type: optional
      operation_channel: optional
      receivable_amount: optional
      discount_amount: optional
      paid_amount: optional
      payment_type: optional
      fee_type: optional
      multi_province: optional
      source_system: optional
      source_type: optional
      source_id: optional
      details: optional
  inspection_result:
    name: 通行查验结果
    description: 对预约、绿色通道或其他特殊车辆在通行过程中进行查验形成的结果。
    properties:
      reference_no: required
      inspection_kind: required
      occurred_at: required
      result: required
      reason: optional
      status: optional
      source_system: optional
      source_type: optional
      source_id: optional
      details: optional
  charge_adjustment:
    name: 计费调整结果
    description: 基于查验或复核对原计费结果形成的二次计费、补收或退费调整事实。
    properties:
      reference_no: required
      adjustment_kind: required
      amount: required
      occurred_at: required
      result: required
      reason: optional
      status: optional
      source_system: optional
      source_type: optional
      source_id: optional
      details: optional
relations:
  contains:
    name: 包含
    description: 一次通行包含其入口、门架和出口事实。
    from: [passage]
    to: [passage_event]
    properties: {relation_status: optional}
  associates:
    name: 关联
    description: 主体、车辆、介质、通行、支付和账户之间可独立存在的业务联系，包括介质发行、持有及 OBU 与 ETC 卡配套。
    from: [party, vehicle, toll_medium, passage, payment, inspection_result, charge_adjustment]
    to: [party, vehicle, toll_medium, account, passage, charge]
    properties: {role: required, relation_status: optional}
  references:
    name: 引用
    description: 通行事实、计费或支付引用介质、发生位置、费率、账户或来源事实。
    from: [passage, passage_event, charge, payment, inspection_result, charge_adjustment]
    to: []
    properties: {role: required, amount: optional, relation_status: optional}
  derives:
    name: 派生
    description: 一次通行根据通行事实与计费依据形成计费结果。
    from: [passage, charge, inspection_result]
    to: [charge, inspection_result, charge_adjustment]
    properties: {role: optional, amount: optional, relation_status: optional}
    acyclic: true
functions:
  get_business_overview:
    name: 获取通行收费主链概览
    description: 汇总通行、通行事实、计费和支付，并报告缺少关键事实的通行。
    usage_prompt: 用户询问整体通行量、应收、实收或支付情况时使用。
    reads: {objects: [passage, passage_event, charge, payment], relations: [contains, references, derives]}
  get_passage_trace:
    name: 获取一次通行主链
    description: 获取指定通行的车辆、实际使用介质、入口门架出口事实、计费和支付链。
    usage_prompt: 用户要求解释某次通行、追溯通行事实或核对收费支付时使用。
    inputs:
      passage_id: {type: string, description: 通行过程对象 ID}
      depth: {type: integer, description: 关系追溯深度, default: 5}
    reads: {objects: [passage, vehicle, toll_medium, passage_event, toll_station, toll_gantry, toll_lane, charge, payment, account], relations: [contains, references, associates, derives]}
  find_incomplete_passages:
    name: 查找不完整通行
    description: 查找缺少入口、出口或计费结果等关键事实的通行过程。
    usage_prompt: 用户询问异常、未完成通行或数据缺口时使用。
    reads: {objects: [passage, passage_event, charge], relations: [contains, derives]}
  get_passage_economics:
    name: 获取通行计费支付汇总
    description: 对指定通行确定性汇总应收、优惠、实收和支付金额；拆分结算由清分结算域解释。
    usage_prompt: 用户询问某次通行的计费和支付金额时使用。
    inputs: {passage_id: {type: string, description: 通行过程对象 ID}}
    reads: {objects: [passage, charge, payment], relations: [references, derives]}
actions:
  register_party:
    name: 登记业务主体
    description: 登记参与车辆、通行或支付主链的客户、发行机构或操作主体。
    icon: building_2
    inputs:
      name: {name: 主体名称, type: string, required: true}
      category: {name: 主体类别, property: category, required: true}
      code: {name: 主体编码, property: code, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 补充信息, property: details, required: false}
    changes: {create: {objects: [party], relations: []}}
    confirmation: 登记新的业务主体。
  register_vehicle:
    name: 登记车辆
    description: 在当前业务主体下登记车辆并建立车主关系。
    icon: car_front
    "on": [party]
    inputs:
      name: {name: 车辆名称, type: string, required: true}
      plate_no: {name: 车牌号, property: plate_no, required: true}
      vehicle_type: {name: 车型, property: vehicle_type, required: false}
      status: {name: 状态, property: status, required: false, default: active}
      details: {name: 补充信息, property: details, required: false}
    changes: {create: {objects: [vehicle], relations: [associates]}}
    confirmation: 登记车辆并建立车主关系。
  register_medium:
    name: 登记通行介质
    description: 登记 OBU、ETC 卡、CPC 卡或纸券等通行介质。
    icon: credit_card
    inputs:
      name: {name: 介质名称, type: string, required: true}
      medium_kind: {name: 介质类型, property: medium_kind, required: true}
      code: {name: 介质编码, property: code, required: true}
      status: {name: 状态, property: status, required: false, default: active}
      valid_from: {name: 生效日期, property: valid_from, required: false}
      valid_to: {name: 失效日期, property: valid_to, required: false}
      details: {name: 补充信息, property: details, required: false}
    changes: {create: {objects: [toll_medium], relations: []}}
    confirmation: 登记通行介质。
  bind_vehicle_medium:
    name: 绑定车辆与介质
    description: 建立车辆与 OBU 或 ETC 卡的长期绑定；CPC 卡和纸券不使用此操作。
    icon: link_2
    "on": [vehicle]
    inputs:
      medium_id: {name: 通行介质, objects: [toll_medium], required: true}
      role: {name: 绑定角色, property: role, required: true}
    requires:
      - object_status: {object: $context, in: [active], message: 只有有效车辆可以绑定 OBU 或 ETC 卡。}
      - object_status: {object: $input.medium_id, in: [active], message: 只有有效的 OBU 或 ETC 卡可以绑定车辆。}
    changes: {create: {objects: [], relations: [associates]}}
    confirmation: 建立车辆与长期通行介质的绑定关系。
  pair_toll_media:
    name: 配套 OBU 与 ETC 卡
    description: 为当前 OBU 关联配套使用的有效 ETC 卡；CPC 卡和纸券不使用此操作。
    icon: panels_top_left
    "on": [toll_medium]
    inputs:
      card_id: {name: 配套 ETC 卡, objects: [toll_medium], required: true}
    requires:
      - object_status: {object: $context, in: [active], message: 当前 OBU 必须处于有效状态。}
      - object_status: {object: $input.card_id, in: [active], message: 配套 ETC 卡必须处于有效状态。}
    changes: {create: {objects: [], relations: [associates]}}
    confirmation: 建立 OBU 与 ETC 卡的配套关系。
  assign_medium_party:
    name: 关联介质业务主体
    description: 记录当前 OBU 或 ETC 卡的发行机构或持有人，不重复保存发行机构编号、用户编号等外键属性。
    icon: building_2
    "on": [toll_medium]
    inputs:
      party_id: {name: 业务主体, objects: [party], required: true}
      role: {name: 主体角色, property: role, required: true, options: [issuer, holder]}
    changes: {create: {objects: [], relations: [associates]}}
    confirmation: 建立通行介质与发行机构或持有人的关系。
  record_passage:
    name: 登记通行过程
    description: 为当前车辆登记一次通行，并关联本次实际使用的通行介质。
    icon: car_front
    "on": [vehicle]
    inputs:
      reference_no: {name: 通行流水号, property: reference_no, required: true}
      mode: {name: 通行方式, property: mode, required: true}
      medium_id: {name: 本次使用介质, objects: [toll_medium], required: false}
      status: {name: 状态, property: status, required: false, default: in_progress}
      source_system: {name: 来源系统, property: source_system, required: false}
      source_type: {name: 来源记录类型, property: source_type, required: false}
      source_id: {name: 来源记录标识, property: source_id, required: false}
      details: {name: 通行信息, property: details, required: false}
    changes: {create: {objects: [passage], relations: [associates, references]}}
    confirmation: 登记通行过程并关联车辆和本次使用介质。
  record_passage_event:
    name: 登记通行事实
    description: 在当前通行中登记入口、门架、出口或牌识事实，并关联发生位置。
    icon: scan_line
    "on": [passage]
    inputs:
      reference_no: {name: 事实流水号, property: reference_no, required: true}
      event_kind: {name: 事实类别, property: event_kind, required: true, options: [transaction, identification]}
      stage: {name: 通行阶段, property: stage, required: true}
      occurred_at: {name: 发生时间, property: occurred_at, required: true}
      location_id: {name: 发生位置, objects: [toll_station, toll_gantry, toll_lane], required: true}
      result: {name: 处理结果, property: result, required: false, default: recorded}
      charged_vehicle_type: {name: 计费车型, property: charged_vehicle_type, required: false}
      axle_count: {name: 计费轴数, property: axle_count, required: false}
      receivable_amount: {name: 应收金额, property: receivable_amount, required: false}
      discount_amount: {name: 优惠金额, property: discount_amount, required: false}
      paid_amount: {name: 实收金额, property: paid_amount, required: false}
      payment_type: {name: 支付类型, property: payment_type, required: false}
      transaction_type: {name: 交易类型, property: transaction_type, required: false}
      operation_channel: {name: 作业渠道, property: operation_channel, required: false}
      fee_type: {name: 计费类型, property: fee_type, required: false}
      multi_province: {name: 是否跨省, property: multi_province, required: false}
      medium_id: {name: 事件涉及介质, objects: [toll_medium], required: false}
      medium_role: {name: 介质关系角色, property: role, required: false, default: used_medium, options: [issued_medium, recovered_medium, used_medium]}
      source_system: {name: 来源系统, property: source_system, required: false}
      source_type: {name: 来源记录类型, property: source_type, required: false}
      source_id: {name: 来源记录标识, property: source_id, required: false}
      details: {name: 事实详情, property: details, required: false}
    changes: {create: {objects: [passage_event], relations: [contains, references]}}
    confirmation: 登记通行阶段事实并关联发生位置。
  record_charge:
    name: 登记计费结果
    description: 根据当前通行登记计费结果，并引用费率控制域提供的计费依据。
    icon: calculator
    "on": [passage]
    inputs:
      reference_no: {name: 计费流水号, property: reference_no, required: true}
      receivable_amount: {name: 应收金额, property: receivable_amount, required: true}
      discount_amount: {name: 优惠金额, property: discount_amount, required: false}
      paid_amount: {name: 实收金额, property: paid_amount, required: true}
      occurred_at: {name: 计费时间, property: occurred_at, required: true}
      result: {name: 计费结果, property: result, required: true}
      version: {name: 费率版本号, property: version, required: false}
      rate_version_id: {name: 费率版本, objects: [rate_version], required: false}
      rate_rule_id: {name: 费率规则, objects: [rate_rule], required: false}
      source_system: {name: 来源系统, property: source_system, required: false}
      source_type: {name: 来源记录类型, property: source_type, required: false}
      source_id: {name: 来源记录标识, property: source_id, required: false}
      details: {name: 计费详情, property: details, required: false}
    changes: {create: {objects: [charge], relations: [derives, references]}}
    confirmation: 登记计费结果并关联通行和计费依据。
  record_payment:
    name: 登记支付事实
    description: 登记针对当前计费结果的支付事实，并可引用客户账户域中的账户。
    icon: circle_dollar_sign
    "on": [charge]
    inputs:
      reference_no: {name: 支付流水号, property: reference_no, required: true}
      amount: {name: 支付金额, property: amount, required: true}
      payment_type: {name: 支付类型, property: payment_type, required: true}
      occurred_at: {name: 支付时间, property: occurred_at, required: true}
      result: {name: 支付结果, property: result, required: true}
      account_id: {name: 支付账户, objects: [account], required: false}
      source_system: {name: 来源系统, property: source_system, required: false}
      source_type: {name: 来源记录类型, property: source_type, required: false}
      source_id: {name: 来源记录标识, property: source_id, required: false}
      details: {name: 支付详情, property: details, required: false}
    changes: {create: {objects: [payment], relations: [references, associates]}}
    confirmation: 登记支付事实并关联计费结果和支付账户。
  record_inspection_result:
    name: 登记通行查验
    description: 为当前通行登记预约、绿色通道或其他特殊车辆查验结果。
    icon: clipboard_check
    "on": [passage]
    inputs:
      reference_no: {name: 查验流水号, property: reference_no, required: true}
      inspection_kind: {name: 查验类型, property: inspection_kind, required: true, options: [reservation, green_channel, special_vehicle]}
      occurred_at: {name: 查验时间, property: occurred_at, required: true}
      result: {name: 查验结果, property: result, required: true}
      reason: {name: 查验说明, property: reason, required: false}
      event_id: {name: 对应通行事实, objects: [passage_event], required: false}
      status: {name: 状态, property: status, required: false, default: completed}
      source_system: {name: 来源系统, property: source_system, required: false}
      source_type: {name: 来源记录类型, property: source_type, required: false}
      source_id: {name: 来源记录标识, property: source_id, required: false}
      details: {name: 查验详情, property: details, required: false}
    changes: {create: {objects: [inspection_result], relations: [derives, references]}}
    confirmation: 登记通行查验结果。
  record_charge_adjustment:
    name: 登记计费调整
    description: 基于当前计费结果登记二次计费、补收或退费调整。
    icon: calculator
    "on": [charge]
    inputs:
      reference_no: {name: 调整流水号, property: reference_no, required: true}
      adjustment_kind: {name: 调整类型, property: adjustment_kind, required: true, options: [second_charge, supplementary_charge, refund]}
      amount: {name: 调整金额, property: amount, required: true}
      occurred_at: {name: 调整时间, property: occurred_at, required: true}
      result: {name: 调整结果, property: result, required: true}
      reason: {name: 调整原因, property: reason, required: false}
      inspection_id: {name: 依据查验, objects: [inspection_result], required: false}
      status: {name: 状态, property: status, required: false, default: completed}
      source_system: {name: 来源系统, property: source_system, required: false}
      source_type: {name: 来源记录类型, property: source_type, required: false}
      source_id: {name: 来源记录标识, property: source_id, required: false}
      details: {name: 调整详情, property: details, required: false}
    changes: {create: {objects: [charge_adjustment], relations: [derives, references]}}
    confirmation: 登记计费调整结果。
agent:
  excluded_tools: [dispatch_workers]
  instructions:
  - 本域只解释车辆一次通行形成计费与支付的经营主链；账户记账、拆分结算、设施运营和费率发布由相应业务域负责。
  - passage 聚合一次完整通行，入口、门架和出口是 passage_event，不是多次独立通行。
  - 车辆与 OBU 或 ETC 卡的长期绑定使用 associates；某次通行实际使用介质使用 references，CPC 卡和纸券不能解释为长期绑定。
  - OBU 与 ETC 卡是两个独立通行介质；配套关系使用 associates(role=paired_card)，发行机构和持有人使用 associates(role=issuer/holder)，不要把相关对象 ID 冗余写成属性。
  - 绑定车辆或配套介质时必须使用有效对象；CPC 卡和纸券只能在具体通行事实中发放、回收或使用。
  - CPC 卡入口发放和出口回收由 passage_event 引用 toll_medium，并使用 issued_medium、recovered_medium 角色。
  - 解释一次通行优先使用 get_passage_trace；询问计费和支付金额使用 get_passage_economics。
  - 询问账户余额、拆分结算、路网设施或费率规则时，应切换或组合相应业务域。
