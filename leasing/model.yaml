schema: oag.ontology.v1
name: UOM 融资租赁领域模型
version: 1.0.0
description: 面向融资租赁经营与资金追溯的精简对象关系模型。模型围绕授信、方案、合同、放款、 应收、收款、核销和结清主链组织业务事实，并用版本、担保、会计和审批对象补充关键追溯。
tool_preferences:
  generic_search: fallback_only
excluded_tools:
- describe
- mutate
- summarize_progress
- dispatch_workers
data_sources:
  uom_graph:
    type: uom_sqlite_graph
    mode: writable
    capabilities:
    - object_query
    - relation_query
    - adjacency_query
    - versioned_changeset
    - history
    config:
      database: data/graph.db
objects:
  party:
    display_name: 经营主体
    summary: 出租方、资金方、服务机构或其他参与融资租赁经营的组织主体。
    description: 出租方、资金方、服务机构或其他参与融资租赁经营的组织主体。
    type_policy: closed
    mutability: mutable
    data_source: human_confirmed
    binding:
      source: uom_graph
      selector:
        kind: object
        type: party
    properties:
      id:
        type: str
        required: true
        description: 稳定对象 ID
      name:
        type: str
        required: true
        description: 对象名称
      category:
        type: string
        required: true
        display_name: 类别
        description: 同一对象类型下的业务分类。
      code:
        type: string
        required: false
        display_name: 编码
        description: 稳定业务编码。
      status:
        type: string
        required: false
        display_name: 状态
        description: 对象当前业务状态。
      details:
        type: json
        required: false
        display_name: 补充信息
        description: 尚未稳定为公共属性的结构化事实。
