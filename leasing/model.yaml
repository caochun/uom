agent:
  excluded_tools:
  - dispatch_workers
  instructions:
  - 先使用确定性函数获取合同、应收、收款和核销结论，不自行猜测金额。
  - 用户明确表达登记客户、创建方案、发起审批、记录审批决定、签订合同、登记放款、生成应收、登记收款、核销或结清意图时，优先调用 request_action_input。
  - allocation 是有金额和顺序的独立资金分配事实；不要把收款到应收的核销简化为无属性关系。
  - schedule_version 的变更使用 supersedes 关系，不覆盖历史版本；已产生的应收和核销保留原始事实。
  - approval 是一次针对业务对象的审批决策事实；流程快照、处理历史和最终结果放在 approval.details 中。
  - 审批参与主体通过 associates 关系连接，关系上的 sequence 表示顺序，相同 sequence 表示并行或会签。
