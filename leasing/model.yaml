schema: uom.domain.v1
name: UOM 融资租赁领域模型
version: 1.0.0
description: 面向融资租赁经营与资金追溯的精简对象关系模型。模型围绕授信、方案、合同、放款、 应收、收款、核销和结清主链组织业务事实，并用版本、担保、会计和审批对象补充关键追溯。
repositories:
  graph:
    type: sqlite_graph
    mode: writable
    config:
      database: data/graph.db
default_repository: graph
properties:
  category:
    name: 类别
    type: string
    description: 同一对象类型下的业务分类。
  code:
    name: 编码
    type: string
    description: 稳定业务编码。
  status:
    name: 状态
    type: string
    description: 对象当前业务状态。
  details:
    name: 补充信息
    type: json
    description: 尚未稳定为公共属性的结构化事实。
  reference_no:
    name: 业务编号
    type: string
    description: 来源系统或业务单据编号。
  amount:
    name: 金额
    type: money
    description: 数值和 ISO 币种组成的金额。
  valid_from:
    name: 生效日
    type: date
    description: 规则或版本开始生效日期。
  valid_to:
    name: 失效日
    type: date
    description: 规则或版本结束生效日期。
  occurred_on:
    name: 业务日期
    type: date
    description: 业务事实发生或记账日期。
  reason:
    name: 原因
    type: string
    description: 调整、冲销或异常处理原因。
  role:
    name: 关系角色
    type: string
    description: 关系端点在业务联系中的角色。
  version:
    name: 版本号
    type: string
    description: 业务规则或计划版本。
  sequence:
    name: 顺序
    type: number
    description: 明细在计划或核销中的顺序。
  due_on:
    name: 到期日
    type: date
    description: 应收或合同约定到期日。
  rate:
    name: 比率
    type: number
    description: 利率、罚息率或费用比例。
  period:
    name: 业务期间
    type: period
    description: 汇总事实所属月份。
objects:
  party:
    name: 经营主体
    description: 出租方、资金方、服务机构或其他参与融资租赁经营的组织主体。
    properties:
      category: required
      code: optional
      status: optional
      details: optional
  customer:
    name: 客户
    description: 承租方、买方、卖方或保证人等客户侧业务主体。
    properties:
      category: optional
      reference_no: required
      status: optional
      details: optional
  credit:
    name: 授信额度
    description: 客户可使用的融资额度及其生命周期状态。
    properties:
      code: required
      category: required
      amount: required
      valid_from: optional
      valid_to: optional
      status: required
  credit_entry:
    name: 额度占用流水
    description: 额度预占、正式占用、释放或冲销形成的变动事实。
    properties:
      category: required
      amount: required
      occurred_on: required
      status: required
      reason: optional
  lease_plan:
    name: 项目方案
    description: 合同签订前对融资金额、期限和租金方案的业务申请。
    properties:
      reference_no: required
      amount: required
      occurred_on: required
      status: required
      details: optional
  contract:
    name: 融资租赁合同
    description: 约定出租、承租、放款、租金和标的物责任的核心业务事实。
    properties:
      reference_no: required
      amount: required
      occurred_on: required
      valid_from: optional
      valid_to: optional
      status: required
      details: optional
  contract_participation:
    name: 合同参与关系事实
    description: 合同参与方及其角色的可追溯事实，承载角色和生效信息。
    properties:
      role: required
      status: optional
      valid_from: optional
      valid_to: optional
  loan:
    name: 放款
    description: 合同项下实际向客户或供应方投放资金的业务事实。
    properties:
      reference_no: required
      amount: required
      occurred_on: required
      status: required
      details: optional
  schedule_version:
    name: 租金计划版本
    description: 合同或变更后生效的租金计算和收款计划版本，历史版本不删除。
    properties:
      version: required
      valid_from: required
      status: required
      details: required
  receivable:
    name: 应收计划明细
    description: 企业对客户形成的一笔具体应收，统一承载租金、费用或其他应收款项。
    properties:
      sequence: required
      category: required
      amount: required
      due_on: required
      status: required
      details: optional
  payment:
    name: 收款
    description: 客户或其他付款人实际到账的资金事实，可分配给多笔应收。
    properties:
      reference_no: required
      amount: required
      occurred_on: required
      category: required
      status: required
      details: optional
  allocation:
    name: 核销明细
    description: 一笔到账资金分配给应收或罚息的金额、顺序和冲销事实。
    properties:
      amount: required
      occurred_on: required
      sequence: required
      status: required
      reason: optional
  penalty:
    name: 逾期罚息
    description: 应收逾期后按规则计提的罚息事实。
    properties:
      amount: required
      occurred_on: required
      rate: optional
      status: required
  subject_matter:
    name: 租赁标的物
    description: 合同项下设备、车辆或受让应收账款等租赁标的及其价值事实。
    properties:
      category: required
      code: optional
      amount: required
      status: required
      details: optional
  guarantee:
    name: 担保关系事实
    description: 合同由保证人或担保物提供担保的金额、方式和顺位事实。
    properties:
      category: required
      amount: required
      sequence: optional
      status: required
      details: optional
  change_order:
    name: 合同变更单
    description: 展期、提前还款、利率调整或租金重排等不可原地修改的变更事实。
    properties:
      reference_no: required
      category: required
      occurred_on: required
      status: required
      details: required
  settlement:
    name: 结清单
    description: 合同结束时对剩余本金、利息、违约金和保证金等进行的最终结算。
    properties:
      reference_no: required
      category: required
      amount: required
      occurred_on: required
      status: required
      details: optional
  invoice:
    name: 发票事实
    description: 由应收或结算事实生成的开票结果。
    properties:
      reference_no: required
      amount: required
      occurred_on: required
      status: required
      details: optional
  voucher:
    name: 会计凭证
    description: 业务事实按科目映射形成的会计凭证头，借贷金额必须平衡。
    properties:
      reference_no: required
      occurred_on: required
      period: required
      amount: required
      status: required
      details: optional
  voucher_line:
    name: 凭证分录
    description: 会计凭证下的借贷科目和金额明细。
    properties:
      sequence: required
      category: required
      amount: required
      status: required
      details: optional
  approval:
    name: 审批申请
    description: 针对一个业务对象发起的一次审批决策事实。details 保存本次采用的流程快照、处理历史和最终结果； 审批参与主体通过 associates 关系连接，不把审批人或审批节点重复塞入业务对象。
    properties:
      reference_no: required
      category: required
      occurred_on: required
      status: required
      details: required
relations:
  contains:
    name: 包含
    description: 整体包含其组成或明细事实。
    from:
    - credit
    - contract
    - schedule_version
    - payment
    - voucher
    - approval
    to:
    - credit_entry
    - contract_participation
    - receivable
    - allocation
    - voucher_line
    properties:
      role: optional
  references:
    name: 引用
    description: 业务事实引用另一个独立对象作为来源、依据或业务对象。
    from:
    - credit
    - credit_entry
    - lease_plan
    - contract
    - contract_participation
    - loan
    - schedule_version
    - receivable
    - payment
    - allocation
    - penalty
    - guarantee
    - change_order
    - settlement
    - invoice
    - voucher
    - approval
    to:
    - party
    - customer
    - credit
    - lease_plan
    - contract
    - loan
    - schedule_version
    - receivable
    - payment
    - penalty
    - subject_matter
    - guarantee
    - change_order
    - settlement
    - invoice
    - voucher
    properties:
      role: required
  associates:
    name: 关联
    description: 两个独立对象之间存在业务联系，例如客户、出租方、标的物、保证人和审批参与主体。 审批关系可用 sequence、status、occurred_on 和 reason 记录决策顺序及结果。
    from:
    - customer
    - party
    - contract
    - subject_matter
    - guarantee
    - payment
    - allocation
    - approval
    to:
    - customer
    - party
    - contract
    - subject_matter
    - guarantee
    - loan
    - receivable
    - penalty
    - approval
    properties:
      role: required
      status: optional
      sequence: optional
      occurred_on: optional
      reason: optional
      details: optional
  derives:
    name: 派生
    description: 来源业务事实经过计算、处理或汇总形成结果事实。
    from:
    - credit
    - lease_plan
    - contract
    - loan
    - schedule_version
    - payment
    - receivable
    - penalty
    - allocation
    - change_order
    - settlement
    - invoice
    - voucher
    to:
    - credit_entry
    - contract
    - loan
    - schedule_version
    - receivable
    - penalty
    - allocation
    - settlement
    - invoice
    - voucher
    - voucher_line
    properties:
      role: optional
      amount: optional
      reason: optional
    acyclic: true
  supersedes:
    name: 替代版本
    description: 新业务版本替代旧版本，旧事实保留并标记失效。
    from:
    - schedule_version
    - change_order
    to:
    - schedule_version
    - contract
    properties:
      occurred_on: optional
      reason: optional
functions:
  get_finance_overview:
    name: 获取融资租赁业务对象、关系和金额概览
    description: ''
    reads:
      objects:
      - contract
      - receivable
      - payment
      - allocation
      relations:
      - references
      - derives
  get_contract_trace:
    name: 追溯合同从方案、放款、应收到核销和结清的业务链
    description: ''
    reads:
      objects:
      - contract
      - lease_plan
      - loan
      - receivable
      - payment
      - allocation
      - settlement
      relations:
      - references
      - derives
      - contains
    inputs:
      contract_id:
        type: str
        description: 合同对象 ID
      depth:
        type: int
        description: 追溯深度
        default: 5
  find_unallocated_payments:
    name: 查找尚未通过核销明细分配的收款
    description: ''
    reads:
      objects:
      - payment
      - allocation
      relations:
      - derives
      - references
  audit_finance_consistency:
    name: 校验核销金额守恒和凭证借贷平衡
    description: ''
    reads:
      objects:
      - payment
      - allocation
      - voucher
      - voucher_line
      - credit
      - credit_entry
      relations:
      - derives
      - references
      - contains
actions:
  register_customer:
    name: 登记客户
    description: 登记承租方、买方或其他客户侧主体。
    icon: user_round
    'on': []
    context: ''
    inputs:
      name:
        name: 客户名称
        description: ''
        required: true
        type: string
      reference_no:
        name: 客户编号
        description: ''
        required: true
        property: reference_no
      category:
        name: 客户类别
        description: ''
        required: false
        property: category
        default: lessee
    requires: []
    changes:
      create:
        objects:
        - customer
        relations: []
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 登记新的融资租赁客户。
    idempotency: required
  start_approval:
    name: 发起审批
    description: 针对项目方案、合同或其他业务事实发起一次审批决策。
    icon: clipboard-pen_line
    'on':
    - lease_plan
    - contract
    - loan
    - change_order
    - allocation
    - settlement
    context: reviewed_object
    inputs:
      reviewed_object:
        name: 被审批对象
        description: ''
        required: true
        objects:
        - lease_plan
        - contract
        - loan
        - change_order
        - allocation
        - settlement
      reference_no:
        name: 审批编号
        description: ''
        required: true
        property: reference_no
      category:
        name: 审批类型
        description: ''
        required: true
        property: category
      occurred_on:
        name: 发起日期
        description: ''
        required: true
        property: occurred_on
      submitted_by:
        name: 提交主体
        description: ''
        required: true
        objects:
        - party
      process:
        name: 审批流程
        description: ''
        required: true
        type: json
    requires: []
    changes:
      create:
        objects:
        - approval
        relations:
        - references
        - associates
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 发起融资租赁业务审批。
    idempotency: required
  record_approval_decision:
    name: 记录审批决定
    description: 记录审批参与主体对一项审批申请的阶段决定和最终结果。
    icon: clipboard-check
    'on':
    - approval
    context: approval_id
    inputs:
      approval_id:
        name: 审批事项
        description: ''
        required: true
        objects:
        - approval
      decision:
        name: 审批决定
        description: ''
        required: true
        type: string
      occurred_on:
        name: 决定日期
        description: ''
        required: true
        property: occurred_on
      sequence:
        name: 审批顺序
        description: ''
        required: true
        property: sequence
      decided_by:
        name: 决策主体
        description: ''
        required: true
        objects:
        - party
      is_final:
        name: 最终决定
        description: ''
        required: false
        type: boolean
        default: false
      opinion:
        name: 审批意见
        description: ''
        required: false
        type: string
      reason:
        name: 决策原因
        description: ''
        required: false
        property: reason
    requires:
    - object_status:
        object: $input.approval_id
        in:
        - pending
        message: 只有待审批事项可以继续记录审批决定。
    changes:
      create:
        objects: []
        relations:
        - associates
      update:
        objects:
        - approval
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 记录融资租赁审批决定。
    idempotency: required
  create_lease_plan:
    name: 创建项目方案
    description: 为客户建立融资租赁项目方案。
    icon: file_plus_2
    'on':
    - customer
    context: applicant_id
    inputs:
      applicant_id:
        name: 申请客户
        description: ''
        required: true
        objects:
        - customer
      reference_no:
        name: 方案编号
        description: ''
        required: true
        property: reference_no
      amount:
        name: 融资金额
        description: ''
        required: true
        property: amount
      occurred_on:
        name: 申请日期
        description: ''
        required: true
        property: occurred_on
      credit_id:
        name: 占用授信
        description: ''
        required: true
        objects:
        - credit
      details:
        name: 方案信息
        description: ''
        required: false
        property: details
    requires:
    - object_status:
        object: $input.applicant_id
        in:
        - active
        message: 只有有效客户可以创建项目方案。
    - object_status:
        object: $input.credit_id
        in:
        - active
        message: 项目方案必须使用有效授信。
    - related_object:
        from: $input.credit_id
        to: $input.applicant_id
        relation: references
        role: granted_customer
        message: 所选授信必须属于该申请客户。
    changes:
      create:
        objects:
        - lease_plan
        - credit_entry
        relations:
        - references
        - contains
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 创建融资租赁项目方案。
    idempotency: required
  grant_credit:
    name: 授予客户额度
    description: 为客户建立一项可预占和正式占用的授信额度。
    icon: badge_dollar_sign
    'on':
    - customer
    context: customer_id
    inputs:
      customer_id:
        name: 授信客户
        description: ''
        required: true
        objects:
        - customer
      code:
        name: 额度编号
        description: ''
        required: true
        property: code
      category:
        name: 授信品种
        description: ''
        required: true
        property: category
      amount:
        name: 授信金额
        description: ''
        required: true
        property: amount
      valid_from:
        name: 生效日
        description: ''
        required: false
        property: valid_from
      valid_to:
        name: 到期日
        description: ''
        required: false
        property: valid_to
    requires:
    - object_status:
        object: $input.customer_id
        in:
        - active
        message: 只有有效客户可以被授予额度。
    changes:
      create:
        objects:
        - credit
        relations:
        - references
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 授予客户融资额度。
    idempotency: required
  sign_contract:
    name: 签订融资租赁合同
    description: 将项目方案落地为正式融资租赁合同。
    icon: file_check_2
    'on':
    - lease_plan
    context: lease_plan_id
    inputs:
      lease_plan_id:
        name: 项目方案
        description: ''
        required: true
        objects:
        - lease_plan
      reference_no:
        name: 合同编号
        description: ''
        required: true
        property: reference_no
      amount:
        name: 合同金额
        description: ''
        required: true
        property: amount
      occurred_on:
        name: 签约日期
        description: ''
        required: true
        property: occurred_on
      lessor_id:
        name: 出租方
        description: ''
        required: true
        objects:
        - party
      lessee_id:
        name: 承租方
        description: ''
        required: true
        objects:
        - customer
      credit_id:
        name: 占用授信
        description: ''
        required: true
        objects:
        - credit
    requires:
    - related_object:
        from_type: approval
        to: $input.lease_plan_id
        relation: references
        role: reviewed_object
        properties:
          status: approved
        message: 签订合同前，项目方案必须存在已通过的审批。
    - object_status:
        object: $input.lease_plan_id
        in:
        - approved
        message: 只有已审批通过且尚未签约的项目方案可以签订合同。
    - object_status:
        object: $input.credit_id
        in:
        - active
        message: 签约使用的授信必须有效。
    - related_object:
        from: $input.lease_plan_id
        to: $input.credit_id
        relation: references
        role: reserved_credit
        message: 签约使用的授信必须是该方案预占的授信。
    - related_object:
        from: $input.lease_plan_id
        to: $input.lessee_id
        relation: references
        role: applicant
        message: 合同承租方必须是该方案的申请客户。
    changes:
      create:
        objects:
        - contract
        - contract_participation
        - credit_entry
        relations:
        - derives
        - contains
        - references
      update:
        objects:
        - lease_plan
        relations: []
      retire:
        objects: []
        relations: []
    confirmation: 签订融资租赁合同。
    idempotency: required
  record_loan:
    name: 登记放款
    description: 记录合同项下的实际资金投放。
    icon: banknote
    'on':
    - contract
    context: contract_id
    inputs:
      contract_id:
        name: 所属合同
        description: ''
        required: true
        objects:
        - contract
      reference_no:
        name: 放款编号
        description: ''
        required: true
        property: reference_no
      amount:
        name: 放款金额
        description: ''
        required: true
        property: amount
      occurred_on:
        name: 放款日期
        description: ''
        required: true
        property: occurred_on
    requires:
    - object_status:
        object: $input.contract_id
        in:
        - active
        message: 只有生效中的合同可以登记放款。
    changes:
      create:
        objects:
        - loan
        relations:
        - derives
      update:
        objects: []
        relations: []
      retire:
        objects: []
        relations: []
